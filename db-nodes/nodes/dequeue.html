<script type="text/javascript">
(function () {
    function editorValue(node, property) {
        var input = $("#node-input-" + property);
        if ($("#dequeue-filtering").data("node-id") === node.id && input.length) {
            return input.val();
        }
        return node[property];
    }

    function validCondition(value) {
        return typeof value === "string" && !!value.trim() &&
            !/[\x00-\x1f\x7f-\x9f\u2028\u2029]/.test(value) &&
            new TextEncoder().encode(value).length <= 4000;
    }

RED.nodes.registerType("dequeue", {
    category: "oracle db",
    color: "#4C825C",
    defaults: {
        name: { value: "" },
        connection: { type: "db-connection", required: true },
        mode: { value: "transactional" },
        inputs: { value: 1 },
        queueName: { value: "", required: true },
        subscriber: { value: "" },
        conditionSource: { value: "none", validate: function (value) {
            if (value === undefined) { value = "none"; }
            return ["none", "editor", "msg"].indexOf(value) !== -1 &&
                !(value === "msg" && editorValue(this, "mode") === "continuous");
        } },
        condition: { value: "", validate: function (value) {
            return editorValue(this, "conditionSource") !== "editor" || validCondition(value);
        } },
        wait: { value: 0 },
        waitForever: { value: false },
        batchSize: { value: 1 },
        deqMode: { value: "remove" },
        payloadType: { value: "json" },
        adtTypeName: { value: "" },
        retryEnabled: { value: true },
        retryDelayMs: { value: 5000 },
        maxRetries: { value: 0 }
    },
    inputs: 1, outputs: 1,
    icon: "font-awesome/fa-download",
    label: function () { return this.name || "dequeue"; },
    paletteLabel: "dequeue",
    oneditprepare: function () {
        $("#dequeue-filtering").data("node-id", this.id);
        var conditionSource = this.conditionSource === undefined ? "none" : this.conditionSource;
        if (["none", "editor", "msg"].indexOf(conditionSource) === -1) {
            $("#node-input-conditionSource").append(new Option("Invalid saved source", conditionSource));
        }
        $("#node-input-conditionSource").val(conditionSource);
        $("#dequeue-filtering").prop("open", conditionSource !== "none");

        function updateAdvancedSummary() {
            var summary = [];
            var mode = $("#node-input-deqMode").val();
            if (mode !== "remove") {
                summary.push(mode === "browse" ? "Browse" : "Locked");
            }
            if ($("#node-input-mode").val() === "continuous") {
                if (!$("#node-input-retryEnabled").is(":checked")) {
                    summary.push("retries off");
                } else {
                    var delay = Number($("#node-input-retryDelayMs").val());
                    var retries = Number($("#node-input-maxRetries").val());
                    if (delay !== 5000) { summary.push("retry " + delay + " ms"); }
                    if (retries !== 0) { summary.push(retries + " retries"); }
                }
            } else if ($("#node-input-waitForever").is(":checked")) {
                summary.push("wait indefinitely");
            } else if (Number($("#node-input-wait").val()) !== 0) {
                summary.push("wait " + $("#node-input-wait").val() + " s");
            }
            $("#dequeue-advanced-summary").text(summary.join("; ") || "Default settings");
        }

        function updateFiltering() {
            var source = $("#node-input-conditionSource").val();
            var continuousMessage = source === "msg" && $("#node-input-mode").val() === "continuous";
            var invalidSource = ["none", "editor", "msg"].indexOf(source) === -1;
            $("#dequeue-condition-row").toggle(source === "editor");
            $("#dequeue-condition-message-hint").toggle(source === "msg");
            $("#dequeue-filter-summary").text(source === "none" ? "Off" :
                source === "editor" ? "Active — Editor" : source === "msg" ? "Active — Message" : "Invalid source");
            $("#dequeue-condition-error").text(continuousMessage ?
                "Message conditions are not available in Continuous mode. Select None or Editor, or use Transactional mode." :
                "Select a valid condition source: None, Editor or Message.").toggle(continuousMessage || invalidSource);
            $("#node-input-condition").trigger("change");
        }
        $("#node-input-conditionSource").on("change", updateFiltering);
        function updateMode() {
            var isContinuous = $("#node-input-mode").val() === "continuous";
            $("#wait-section").toggle(!isContinuous);
            $("#continuous-note").toggle(isContinuous);
            $("#transactional-note").toggle(!isContinuous);
            $("#retry-section").toggle(isContinuous);
            updateRetryRows();
            $("#node-input-conditionSource").trigger("change");
            updateAdvancedSummary();
        }
        updateMode();
        $("#node-input-mode").on("change", updateMode);

        // Toggle wait field based on waitForever checkbox
        function updateWait() {
            if ($("#node-input-waitForever").is(":checked")) {
                $("#wait-row").hide();
            } else {
                $("#wait-row").show();
            }
        }
        updateWait();
        $("#node-input-waitForever").on("change", updateWait);

        function updateRetryRows() {
            var retriesEnabled = $("#node-input-retryEnabled").is(":checked");
            $("#retry-options").toggle(retriesEnabled);
        }
        updateRetryRows();
        $("#node-input-retryEnabled").on("change", updateRetryRows);

        function updatePayloadType() {
            $("#dequeue-adt-row").toggle($("#node-input-payloadType").val() === "adt");
        }
        $("#node-input-payloadType").on("change", updatePayloadType);
        updatePayloadType();

        // Update dequeue mode hint
        $("#node-input-deqMode").on("change", function() {
            var mode = $(this).val();
            var hints = {
                "remove": "Message is permanently removed from the queue on commit. Use this for normal message consumption.",
                "browse": "Message is read but stays in the queue. No lock, no removal. Use for monitoring or inspecting queue contents.",
                "locked": "Message is locked for processing but stays in the queue on commit. Use when you need to inspect before deciding to remove."
            };
            $("#deq-mode-hint").text(hints[mode] || "");
        }).trigger("change");
        $("#dequeue-advanced input, #dequeue-advanced select").on("change input", updateAdvancedSummary);
        updateFiltering();
        updateAdvancedSummary();
    },
    oneditsave: function () {
        this.inputs = ($("#node-input-mode").val() === "continuous") ? 0 : 1;
    }
});
}());
</script>

<script type="text/x-red" data-help-name="dequeue">
<p>Reads messages from an Oracle Advanced Queue (AQ), with optional database-side filtering.</p>

<h3>Configuration</h3>
<dl class="message-properties">
    <dt>DB Connection</dt><dd>Shared database connection configuration.</dd>
    <dt>Mode</dt><dd><b>Transactional</b> (default) runs per input and supports Begin/End Transaction. <b>Continuous</b> starts on deploy, has no input port and commits each batch before downstream processing.</dd>
    <dt>Queue Name / Subscriber</dt><dd>Schema-qualified queue name and existing consumer for multi-consumer queues. This field does not create a subscriber. Leave Subscriber blank only for single-consumer queues; otherwise Oracle returns <code>ORA-25231</code>.</dd>
    <dt>Payload Type</dt><dd><b>JSON</b> (default): JavaScript value. <b>RAW</b>: Buffer. <b>ADT</b>: Oracle object converted to a plain object with uppercase attributes; specify the queue's Object Type.</dd>
    <dt>Batch Size</dt><dd>Maximum records per call, each emitted separately. Default: 1; maximum: 10000.</dd>
    <dt>Filter Source / Condition</dt><dd><b>None</b> (default) ignores conditions. <b>Editor</b> uses the configured predicate. <b>Message</b> requires <code>msg.dequeueCondition</code> per Transactional input, with no editor fallback; unavailable in Continuous mode. Conditions must be nonblank, single-line strings of at most 4000 UTF-8 bytes without control characters. Enter a predicate, not a SELECT. Oracle validates support for the queue and payload. This sets the native dequeue condition; it does not change subscriber rules.</dd>
    <dt>Dequeue Mode</dt><dd><b>Remove</b> (default) removes messages on commit. <b>Browse</b> reads without locking/removing; <b>Locked</b> locks without removing on commit. Browse/Locked read one record at a time up to Batch Size; only the first read waits.</dd>
    <dt>Block Indefinitely / Wait (seconds)</dt><dd>Transactional wait for messages; 0 returns immediately when empty.</dd>
    <dt>Enable Retries / Retry Delay / Max Retries</dt><dd>Continuous reconnect controls for DB/dequeue errors. Max Retries 0 means unlimited. Missing Subscriber stops immediately.</dd>
</dl>

<h3>Outputs</h3>
<dl class="message-properties">
    <dt>payload <span class="property-type">JSON value | Buffer | object</span></dt><dd>One dequeued payload per output.</dd>
    <dt>dequeued <span class="property-type">JSON value | Buffer | object</span></dt><dd>The same payload reference at emission. Replacing <code>msg.payload</code> leaves <code>msg.dequeued</code> available if downstream nodes preserve it. In-place object/Buffer changes affect both; this is not an immutable copy. A later Dequeue replaces it; aggregation does not collect all originals here.</dd>
    <dt>error <span class="property-type">object</span></dt><dd>Failure details: <code>{ message, code }</code>.</dd>
</dl>

<h3>Runtime overrides</h3>
<dl class="message-properties">
    <dt>dequeueCondition <span class="property-type">string</span></dt><dd>Required only for Message filtering; cannot override Editor or enable None.</dd>
</dl>

<h3>Details</h3>
<p><b>Transactions:</b> With an active Begin reference, nonempty reads use its connection without committing; applicable locks remain until finalization. Without transaction context, Dequeue commits and closes its own connection. Inactive references report <code>DB_TRANSACTION_INACTIVE</code> instead of starting standalone work.</p>
<p><b>Batch completion:</b> Outputs share the transaction. The first End finalizes all its work and dequeued records without waiting for later records or branches. Gather required completions before End if their results must determine rollback. Batch Size 1 isolates one dequeued record, but does not coordinate its parallel branches.</p>
<p><b>Empty results:</b> No matching records may leave unmatched messages queued. An empty managed Dequeue commits previous transaction work and closes without output; failed DB work still requires rollback. This does not prove other branches finished: active DB work can finish, but queued/later work with the closed reference reports <code>DB_TRANSACTION_INACTIVE</code>.</p>
<p><b>Recovery:</b> Check <code>msg.dequeued</code> exists, then set <code>msg.payload = [msg.dequeued]</code> before Enqueue with editor Payload blank. The outer array preserves an original JSON array as one record. Use Auto-commit if the source transaction closed; an active Begin still needs End. This restores content, not AQ IDs or delivery metadata.</p>
<p><code>msg.dequeued</code> remains in memory while referenced, without a backlog memory limit or crash durability. A crash before recovery commits can lose it. Continuous mode does not wait for downstream completion before fetching more.</p>
<p><b>Continuous operation:</b> Listens with an indefinite AQ wait and interrupts it on stop/redeploy. Rollback protection is unavailable after its batch commit. Status shows <code>dequeued N</code> for two seconds, then <code>listening</code>. Transactional status shows <code>dequeuing...</code>, then <code>dequeued N</code> or <code>no messages</code>.</p>
<p>Terminal operational errors, including retry exhaustion, reach scoped Catch once. Configuration diagnostics such as a missing Subscriber use separate status/log messages.</p>
</script>
