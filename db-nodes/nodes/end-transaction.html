<script type="text/javascript">
RED.nodes.registerType("end-transaction", {
    category: "oracle db",
    color: "#4C825C",
    defaults: {
        name: { value: "" },
        action: { value: "commit" }
    },
    inputs: 1, outputs: 1,
    icon: "font-awesome/fa-stop-circle",
    label: function () {
        if (this.name) return this.name;
        return this.action === "rollback" ? "rollback" : "end transaction";
    },
    paletteLabel: "end transaction",
    oneditprepare: function () {
        // Update label hint when action changes
        $("#node-input-action").on("change", function () {
            var action = $(this).val();
            if (action === "rollback") {
                $("#action-hint").text("Rolls back all changes and returns dequeued messages to the queue.");
            } else {
                $("#action-hint").text("Commits all changes and permanently removes dequeued messages from the queue.");
            }
        }).trigger("change");
    }
});
</script>

<script type="text/x-red" data-template-name="end-transaction">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-action"><i class="fa fa-check-circle"></i> Action</label>
        <select id="node-input-action" style="width:200px;">
            <option value="commit">Commit</option>
            <option value="rollback">Rollback</option>
        </select>
        <div style="margin-left:105px;font-size:11px;color:#888;margin-top:4px;" id="action-hint"></div>
        <div style="margin-left:105px;font-size:11px;color:#888;margin-top:4px;">Applies to database operations in this transaction. External API calls are not committed or undone by this node.</div>
    </div>
</script>

<script type="text/x-red" data-help-name="end-transaction">
<p>Commits or rolls back the database transaction and closes the connection.</p>

<h3>Configuration</h3>
<dl class="message-properties">
    <dt>Action</dt>
    <dd><b>Commit</b> (default): Commits all changes made during the transaction. Dequeued messages
    are permanently removed from the queue. SQL DML on that connection is finalized; external SCM or OCI API calls are not part of the database transaction.<br/>
    <b>Rollback</b>: Rolls back all changes. Dequeued messages return to the queue as if they
    were never consumed, provided the message still carries the transaction reference.<br/>
    If an imported flow contains an unknown action value, the node logs a warning and uses commit behavior.</dd>
</dl>

<h3>Details</h3>
<p>End stops new DB work and waits for the active operation before finalizing once. A failed commit
attempts rollback; connection close is attempted on success or failure. A failed rollback is not repeated.</p>
<p>Once a DB node reports a processing error, that managed transaction can only roll back.
If one insert succeeds and the next fails, Commit rolls back both rather than saving the first,
and reports <code>DB_TRANSACTION_ROLLBACK_REQUIRED</code>.
An invalid transaction reference does not mark a different transaction as failed.</p>
<p>Unknown, timed-out, closing, or already-ended references report <code>inactive transaction</code>
and <code>DB_TRANSACTION_INACTIVE</code> through Catch without another commit/rollback attempt.
Successful output removes <code>msg._dbTransaction</code> and the private handle.</p>
<p>The first End finalizes the whole transaction, including every record returned by a dequeue call.
If all branch results must determine commit or rollback, wait for their completion before End.
A branch still in a Delay node may otherwise reach SQL after the transaction has closed. Later End requests remain inactive-transaction errors; they do not repeat or reverse the first commit.
Runtime-local references cannot resume transactions after restart or transfer to another process.</p>
<p>Enqueue in Auto-commit mode commits on a separate connection. End still finalizes the incoming Begin Transaction and cannot roll back an enqueue already committed in Auto-commit mode.</p>

<h3>Typical Flows</h3>
<p><b>Transactional database processing:</b></p>
<pre>begin transaction → dequeue → sql → end transaction (commit)</pre>
<p><b>Error recovery:</b> A Catch scoped to processing nodes can route to End configured for Rollback.
Preserve <code>msg._dbTransaction</code> through the flow, and keep End outside its own Catch scope.
The reference survives Catch, Function send, and fan-out cloning. With neither reference nor private
handle, End reports <code>no transaction</code> and passes through without a database operation.
Use a nonzero Begin timeout as a cleanup safeguard; cleanup waits for active DB work to settle.</p>
</script>
