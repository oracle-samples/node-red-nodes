<script type="text/javascript">
RED.nodes.registerType("end-transaction", {
    category: "oracle db",
    color: "#4C825C",
    defaults: {
        name: { value: "" },
        action: { value: "commit" }
    },
    inputs: 1, outputs: 1,
    icon: "font-awesome/fa-stop-circle",
    label: function () {
        if (this.name) return this.name;
        return this.action === "rollback" ? "rollback" : "end transaction";
    },
    paletteLabel: "end transaction",
    oneditprepare: function () {
        // Update label hint when action changes
        $("#node-input-action").on("change", function () {
            var action = $(this).val();
            if (action === "rollback") {
                $("#action-hint").text("Rolls back all changes and returns dequeued messages to the queue.");
            } else {
                $("#action-hint").text("Commits all changes and permanently removes dequeued messages from the queue.");
            }
        }).trigger("change");
    }
});
</script>

<script type="text/x-red" data-template-name="end-transaction">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-action"><i class="fa fa-check-circle"></i> Action</label>
        <select id="node-input-action" style="width:200px;">
            <option value="commit">Commit</option>
            <option value="rollback">Rollback</option>
        </select>
        <div style="margin-left:105px;font-size:11px;color:#888;margin-top:4px;" id="action-hint"></div>
        <div style="margin-left:105px;font-size:11px;color:#888;margin-top:4px;">Applies to database operations in this transaction. External API calls are not committed or undone by this node.</div>
    </div>
</script>

<script type="text/x-red" data-help-name="end-transaction">
<p>Commits or rolls back a managed database transaction and closes its connection.</p>

<h3>Configuration</h3>
<dl class="message-properties">
    <dt>Action</dt><dd><b>Commit</b> (default) saves all transaction work, including SQL DML and Remove-mode dequeues. <b>Rollback</b> undoes that uncommitted database work, making removed messages available again. External OCI/SCM API calls are unaffected. Unknown imported action values log a warning and use Commit.</dd>
</dl>

<h3>Details</h3>
<p><b>Completion:</b> The first End stops new DB work, waits for the active operation and finalizes once. It covers every record in that transaction; gather required record/branch completions first. Delayed SQL or later End calls otherwise encounter a closed reference. Later rollback cannot reverse a completed commit.</p>
<p><b>Failed DB work:</b> The transaction becomes rollback-only. Commit then rolls back all its changes and reports <code>DB_TRANSACTION_ROLLBACK_REQUIRED</code>. An invalid reference does not mark another transaction failed. A failed commit attempts rollback; a failed rollback is not repeated. Connection close is attempted on success or failure.</p>
<p><b>References:</b> Preserve <code>msg._dbTransaction</code> through processing and Catch; it supports Function send and fan-out cloning. Unknown, timed-out, closing or ended references report <code>DB_TRANSACTION_INACTIVE</code> through Catch without another DB operation. References cannot survive restart or move between processes.</p>
<p>Successful output removes the reference and private handle. With no reference or handle, End shows <code>no transaction</code> and passes the message through without database work.</p>
<p>Enqueue: Auto-commit uses a separate connection. End still finalizes the original Begin and cannot undo an independently committed enqueue.</p>

<h3>Typical Flows</h3>
<pre>begin transaction → dequeue → sql → end transaction (commit)</pre>
<p>For errors, scope Catch to processing nodes and route it to End: Rollback; exclude End from its own Catch scope. A nonzero Begin timeout provides cleanup if End is not reached, after active DB work settles.</p>
</script>
