<script type="text/x-red" data-help-name="begin-transaction">
<p>Opens a managed Oracle Database transaction for downstream SQL, Enqueue and Dequeue nodes.</p>

<h3>Configuration</h3>
<dl class="message-properties">
    <dt>DB Connection</dt><dd>Shared database connection configuration.</dd>
    <dt>Timeout (seconds)</dt><dd>Optional rollback/close safeguard when End is not reached; 0 disables it. Cleanup waits for active DB work, so this is not a hard execution deadline.</dd>
</dl>

<h3>Outputs</h3>
<dl class="message-properties">
    <dt>msg._dbTransaction <span class="property-type">string</span></dt><dd>Opaque runtime-local reference. Preserve through processing and Catch; do not log, publish or persist it.</dd>
    <dt>msg.transaction.connection <span class="property-type">object</span></dt><dd>Private connection handle under non-enumerable <code>msg.transaction</code>, recovered from the reference after cloning. Do not use it directly or construct transaction objects.</dd>
    <dt>msg.transaction.startedAt <span class="property-type">number</span></dt><dd>Transaction start timestamp in milliseconds.</dd>
    <dt>msg.transaction.timedOut <span class="property-type">boolean</span></dt><dd>True when timeout cleanup is requested.</dd>
    <dt>msg.transaction.endedAt <span class="property-type">number</span></dt><dd>Finalization timestamp in milliseconds.</dd>
</dl>

<h3>Details</h3>
<p>Place Begin before database processing and finish with End. Route a scoped Catch to End: Rollback when processing fails. Dequeue locks remain until rollback or finalization completes.</p>
<p>An active reference for the same DB Connection reuses its transaction and refreshes the timeout. Unknown, timed-out, closing or ended references report <code>DB_TRANSACTION_INACTIVE</code>; another DB Connection's reference reports <code>DB_TRANSACTION_CONFIG_MISMATCH</code>. Neither starts standalone work. References cannot survive restart or move between processes.</p>
<p>Timeout/shutdown stops new work, waits for active DB work, then requests rollback and close once. Connections acquired after shutdown are closed without output. Cleanup cannot interrupt a stuck DB call: use finite AQ waits and database/network execution limits. Pool acquisition timeout only limits waiting for a connection.</p>
<p>DB operations sharing a transaction are serialized. The first End finalizes the whole transaction; gather required branch completions before it. An empty managed Dequeue also closes the transaction, committing previous work unless a DB failure requires rollback. External APIs are outside this transaction.</p>
<p>Enqueue: Transactional uses this connection. Enqueue: Auto-commit uses a separate connection and preserves the incoming reference; the original Begin still needs its own End.</p>

<h3>Typical Flows</h3>
<p><code>begin transaction</code> → <code>dequeue</code> → processing → <code>end transaction</code></p>
</script>
