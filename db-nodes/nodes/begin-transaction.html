<script type="text/x-red" data-help-name="begin-transaction">
<p>Opens a database connection and stores it in <code>msg.transaction.connection</code>
for use by downstream nodes (dequeue, sql, etc.).</p>

<h3>Configuration</h3>
<dl class="message-properties">
    <dt>DB Connection</dt><dd>Database configuration for authentication and connection.</dd>
    <dt>Timeout (seconds)</dt>
    <dd>Optional safety timeout. If the end-transaction node is not reached within this time,
    rollback and close are requested after active DB work settles. Set to <code>0</code> for no timeout.
    This is a cleanup safeguard, not a hard execution deadline.</dd>
</dl>

<h3>Outputs</h3>
<dl class="message-properties">
    <dt>msg._dbTransaction <span class="property-type">string</span></dt>
    <dd>Opaque runtime-local reference. Preserve it unchanged through processing and Catch paths; do not log, publish, or persist it.</dd>
    <dt>msg.transaction.connection <span class="property-type">object</span></dt>
    <dd>Private non-enumerable connection handle. DB nodes recover it from the reference after message cloning. Do not operate on it directly or construct transaction objects manually.</dd>
    <dt>msg.transaction.startedAt <span class="property-type">number</span></dt>
    <dd>Timestamp (ms) when the transaction was opened.</dd>
    <dt>msg.transaction.timedOut <span class="property-type">boolean</span></dt>
    <dd>Set to <code>true</code> when the timeout handler rolls back and closes the transaction.</dd>
    <dt>msg.transaction.endedAt <span class="property-type">number</span></dt>
    <dd>Timestamp (ms) when timeout auto-ended the transaction.</dd>
</dl>

<h3>Details</h3>
<p>Unknown, timed-out, closing, or ended references report <code>DB_TRANSACTION_INACTIVE</code>. References belonging to a different DB Connection report <code>DB_TRANSACTION_CONFIG_MISMATCH</code>. Neither case starts standalone work. References cannot resume a transaction after restart or in another process.</p>
<p>Timeout and shutdown stop new work, wait for active DB work, then roll back and close once. Cleanup cannot interrupt a stuck database call. Use finite AQ waits and database/network execution limits; a pool acquisition timeout limits waiting for a connection, not SQL execution. Connections received after shutdown starts are closed without forwarding a message.</p>
<p>Use this node <b>before</b> a <b>dequeue</b> node to create a managed transaction.
The connection stays open until the <b>end transaction</b> node commits and closes it.
If downstream processing fails, route a scoped Catch to End Transaction configured for Rollback.
Dequeued messages stay locked until rollback or connection cleanup completes.</p>
<p>An active reference for the same DB Connection reuses the existing connection. When timeout is enabled, reuse refreshes
the timeout window so active looping flows do not expire on a stale timer.</p>
<p>DB operations sharing a transaction are serialized. If all branch results must determine commit or rollback, join them before End;
it cannot wait for work that has not arrived yet. An empty managed Dequeue also finalizes the transaction, committing previous work unless a DB failure requires rollback. External API operations are not part of the database transaction.</p>
<p>Enqueue in Transactional mode uses this transaction. Enqueue in Auto-commit mode commits each input on a separate connection and preserves the incoming reference; it does not finalize this Begin Transaction, which still needs its own End.</p>

<h3>Typical Flows</h3>
<p><code>begin transaction</code> → <code>dequeue</code> → <i>(processing nodes)</i> → <code>end transaction</code></p>
</script>
