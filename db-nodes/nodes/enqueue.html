<script type="text/javascript">
var enqueueEditorStyles = '<style id="enqueue-editor-styles">' +
    '.enqueue-payload-toolbar{display:flex;justify-content:flex-end;gap:6px;margin-top:4px;margin-bottom:4px;}' +
    '.enqueue-payload-toolbar .enqueue-json-editor{width:30px;min-width:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;}' +
    '.enqueue-payload-toolbar .enqueue-json-editor i{font-size:11px;}' +
'</style>';
if (!document.getElementById("enqueue-editor-styles")) {
    $("head").append(enqueueEditorStyles);
}

RED.nodes.registerType("enqueue", {
    category: "oracle db",
    paletteLabel: "enqueue",
    defaults: {
        name: { value: "" },
        connection: { type: "db-connection", required: true },
        queueName: { value: "" },
        recipients: { value: "", validate: function (value) {
            return typeof value === "string" && !/[\x00-\x1f\x7f]/.test(value) &&
                (!value.trim() || value.split(",").every(function (name) { return !!name.trim(); }));
        } },
        userPayload: { value: "" },
        deliveryMode: { value: "persistent" },
        payloadType: { value: "json" },
        adtTypeName: { value: "" },
        enableOutput: { value: true },
        independentTransaction: { value: false },
        outputs: { value: 1 }
    },
    inputs: 1, outputs: 1,
    color: "#4C825C",
    icon: "font-awesome/fa-upload",
    label: function () { return this.name || "enqueue"; },
    oneditprepare: function () {
        var node = this;
        $("#node-input-mode").val(node.independentTransaction === true ? "auto-commit" : "transactional");
        function updateMode() {
            var autoCommit = $("#node-input-mode").val() === "auto-commit";
            $("#enqueue-transactional-note").toggle(!autoCommit);
            $("#enqueue-auto-commit-note").toggle(autoCommit);
        }
        $("#node-input-mode").on("change", updateMode);
        updateMode();
        $("#node-input-outputs").val(node.outputs);
        $("#node-input-enableOutput").prop("checked", node.enableOutput !== false);
        $("#node-input-enableOutput").on("change", function () {
            $("#node-input-outputs").val(this.checked ? 1 : 0);
        });
        var PAYLOAD_HINTS = {
            json: 'A JSON object or array. A single object is enqueued as one message; each array element becomes a separate message. If empty, <code>msg.payload</code> is used.',
            raw:  'A plain string, encoded to a UTF-8 Buffer. For multiple messages, leave empty and pass an array of strings or Buffers via <code>msg.payload</code>.',
            adt:  'A JSON object or array. Field names must match the Oracle type\'s attribute names (uppercase). A single object becomes one message; each array element becomes a separate message. If empty, <code>msg.payload</code> is used.'
        };
        function updatePayloadType() {
            var type = $("#node-input-payloadType").val();
            $("#enqueue-adt-row").toggle(type === "adt");
            var isJsonLike = (type === "json" || type === "adt");
            $(".enqueue-json-editor").toggle(isJsonLike);
            $("#enqueue-payload-hint").html(PAYLOAD_HINTS[type] || PAYLOAD_HINTS.json);
        }
        $("#node-input-payloadType").on("change", updatePayloadType);
        updatePayloadType();

        $(".enqueue-json-editor").on("click", function () {
            var type = $("#node-input-payloadType").val();
            if (type !== "json" && type !== "adt") return;
            if (!(RED.editor && RED.editor.editJSON)) {
                RED.notify("JSON editor is not available in this Node-RED version.", { type: "warning" });
                return;
            }
            var payloadEl = $("#node-input-userPayload");
            RED.editor.editJSON({
                value: payloadEl.val() || "",
                complete: function (value) {
                    var next = value;
                    if (value && typeof value === "object" && value.value !== undefined) {
                        next = value.value;
                    }
                    payloadEl.val(next || "");
                }
            });
        });

        function updateDeliveryWarning() {
            if ($("#node-input-deliveryMode").val() === "buffered") {
                $("#enqueue-persistent-note").hide();
                $("#enqueue-buffered-warning").show();
            } else {
                $("#enqueue-persistent-note").show();
                $("#enqueue-buffered-warning").hide();
            }
        }
        $("#node-input-deliveryMode").on("change", updateDeliveryWarning);
        updateDeliveryWarning();
    },
    oneditsave: function () {
        this.independentTransaction = $("#node-input-mode").val() === "auto-commit";
    }
});
</script>

<script type="text/x-red" data-template-name="enqueue">
    <div class="form-row">
        <label for="node-input-name" style="width:130px;"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-connection" style="width:130px;"><i class="fa fa-database"></i> DB Connection</label>
        <input type="text" id="node-input-connection" />
    </div>
    <div class="form-row">
        <label for="node-input-mode" style="width:130px;"><i class="fa fa-exchange"></i> Mode</label>
        <select id="node-input-mode" style="width:200px;">
            <option value="transactional">Transactional</option>
            <option value="auto-commit">Auto-commit</option>
        </select>
    </div>
    <div id="enqueue-transactional-note" style="margin:0 0 8px 135px;font-size:11px;color:#888;">
        Uses the incoming Begin Transaction; otherwise opens a standalone transaction and commits automatically.
    </div>
    <div id="enqueue-auto-commit-note" style="display:none;margin:0 0 8px 135px;font-size:11px;color:#856404;background:#fff3cd;border:1px solid #ffc107;border-radius:3px;padding:5px 8px;">
        <i class="fa fa-exclamation-triangle"></i> Commits each input in a separate transaction. Does not commit or roll back an incoming Begin Transaction; it still needs its own End.
    </div>
    <hr/>
    <div class="form-row">
        <label for="node-input-queueName"><i class="fa fa-list-ul"></i> Queue Name</label>
        <input type="text" id="node-input-queueName">
    </div>
    <div class="form-row">
        <label for="node-input-recipients"><i class="fa fa-users"></i> Recipients</label>
        <input type="text" id="node-input-recipients">
        <div style="margin-left:105px;font-size:11px;color:#888;margin-top:2px;">Comma-separated subscriber names, applied to every message. Leave blank to use the queue's subscriptions.</div>
    </div>
    <div class="form-row">
        <label for="node-input-deliveryMode"><i class="fa fa-tachometer"></i> Delivery Mode</label>
        <select id="node-input-deliveryMode" style="width:200px;">
            <option value="persistent">Persistent (default)</option>
            <option value="buffered">Buffered</option>
        </select>
    </div>
    <div id="enqueue-persistent-note" style="margin-left:105px;font-size:11px;color:#888;margin-top:-6px;">
        Messages are written to the queue table and committed to disk — durable across database restarts.
    </div>
    <div id="enqueue-buffered-warning" style="margin-left:105px;font-size:11px;color:#c47a00;margin-top:-6px;display:none;">
        Buffered messages require immediate visibility and do not support JSON payloads. This node does not configure immediate visibility; use Persistent for the documented workflow.
    </div>
    <hr/>
    <div class="form-row">
        <label for="node-input-payloadType"><i class="fa fa-file-code-o"></i> Payload Type</label>
        <select id="node-input-payloadType" style="width:200px;">
            <option value="json">JSON</option>
            <option value="raw">RAW</option>
            <option value="adt">ADT (Object Type)</option>
        </select>
    </div>
    <div id="enqueue-adt-row" class="form-row" style="display:none">
        <label for="node-input-adtTypeName"><i class="fa fa-cube"></i> Object Type</label>
        <input type="text" id="node-input-adtTypeName" placeholder="SCHEMA.TYPE_NAME">
        <div style="font-size:11px;color:#888;margin-top:2px;">Schema-qualified Oracle object type name (uppercase). e.g. <code>ADMIN.MY_MSG_TYPE</code></div>
    </div>
    <div class="form-row">
        <label for="node-input-userPayload" style="width:130px;vertical-align:top;margin-top:2px;"><i class="fa fa-code"></i> Payload</label>
        <div style="width:calc(100% - 137px);display:inline-block;">
            <div id="enqueue-payload-hint" style="font-size:11px;color:#888;margin-bottom:4px;"></div>
            <div class="enqueue-payload-toolbar">
                <button type="button" class="red-ui-button red-ui-button-small enqueue-json-editor" title="Open JSON editor">
                    <i class="fa fa-ellipsis-h"></i>
                </button>
            </div>
            <textarea id="node-input-userPayload" rows="5" style="width:100%;font-family:monospace;"></textarea>
        </div>
    </div>
    <hr/>
    <div class="form-row">
        <label for="node-input-enableOutput" style="width:130px;"><i class="fa fa-sign-out"></i> Pass Message</label>
        <input type="checkbox" id="node-input-enableOutput" style="width:auto;">
        <span style="margin-left:6px;font-size:12px;color:#888;">Pass message downstream after successful enqueue.</span>
    </div>
    <input type="hidden" id="node-input-outputs">
</script>

<script type="text/x-red" data-help-name="enqueue">
<p>Enqueues one or more messages into an Oracle Advanced Queue (AQ).</p>

<h3>Configuration</h3>
<dl class="message-properties">
    <dt>DB Connection</dt><dd>Shared database connection configuration.</dd>
    <dt>Mode</dt>
    <dd><b>Transactional</b> (default) uses the incoming Begin Transaction; End commits or rolls back. Without transaction context, it opens a connection, enqueues, commits and closes. <b>Auto-commit</b> always uses a separate connection and commits each input, including inputs carrying a closed transaction reference. It neither finalizes nor marks the original transaction rollback-only on failure; an active original still needs its own End.</dd>
    <dt>Queue Name</dt><dd>Existing destination AQ.</dd>
    <dt>Recipients</dt><dd>Optional comma-separated subscribers for each message in a multi-consumer queue. Spaces are trimmed; case is preserved. Empty entries and control characters are invalid. Blank uses the queue's subscriptions.</dd>
    <dt>Delivery Mode</dt>
    <dd><b>Persistent</b> (default) survives database restarts after commit. <b>Buffered</b> requires immediate visibility and does not support JSON. This node uses <code>enqMany</code> without immediate visibility, so Buffered may fail with <code>ORA-25298</code>. Thin mode does not support immediate visibility with <code>enqMany</code>; switching modes does not configure it. Use Persistent for the documented workflow.</dd>
    <dt>Payload Type / Object Type</dt>
    <dd><b>JSON</b> (default) uses <code>DB_TYPE_JSON</code>. <b>RAW</b> accepts a Buffer or UTF-8 string. <b>ADT</b> converts objects to the specified Oracle Object Type; use uppercase attribute names. The schema-qualified type must exist and match the queue.</dd>
    <dt>Payload</dt>
    <dd>Configured value, or <code>msg.payload</code> when blank. JSON/ADT accepts one object or an array: each array element becomes one AQ message. RAW accepts plain text. Use <code>...</code> for the JSON/ADT editor.</dd>
</dl>

<h3>Outputs</h3>
<p><b>Pass Message</b> (enabled by default) forwards the input after success, adding <code>msg.count</code>. Disable it for a terminal sink.</p>
<dl class="message-properties">
    <dt>count <span class="property-type">number</span></dt><dd>Number of messages enqueued.</dd>
    <dt>error <span class="property-type">object</span></dt><dd>Failure details: <code>{ message, code }</code>, routed through Catch.</dd>
</dl>

<h3>Details</h3>
<p>Transactional mode rejects inactive references with <code>DB_TRANSACTION_INACTIVE</code>; it does not silently start standalone work. Auto-commit preserves the incoming transaction reference on success and Catch paths. End cannot roll back an independently committed enqueue.</p>
<p><b>Payload recovery:</b> If <code>msg.dequeued</code> still contains the required payload, set <code>msg.payload = [msg.dequeued]</code> in a Function and leave editor Payload blank. Check the property exists and match the queue's Payload Type. The outer array keeps an original JSON array as one AQ record.</p>
<p>Use Auto-commit when the source transaction has closed. This recovers content, not the original AQ message ID or delivery metadata. Re-enqueueing is replay, not rollback; it is not crash-safe until its commit succeeds. External side effects may need application-level deduplication.</p>
</script>
