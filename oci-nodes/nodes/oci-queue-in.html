<script type="text/x-red" data-help-name="oci-queue-in">
<p>Starts long-polling OCI Queue when deployed. Emits individual messages by default, or one batch array per non-empty receive response.</p>
<h3>Configuration</h3>
<dl class="message-properties">
    <dt>Output Mode</dt><dd>Individual messages (default) or Batch array. An array-valued message remains one record; its contents are never split.</dd>
    <dt>Batch Limit</dt><dd>Maximum messages per receive request, from 1 to 20.</dd>
    <dt>Poll Timeout</dt><dd>Long-poll wait from 1 to 30 seconds. Zero selects short polling and applies Retry Delay after empty responses.</dd>
    <dt>Visibility</dt><dd>How long received messages are hidden. Leave empty for the queue default.</dd>
    <dt>Channel Filter</dt><dd>Optional channel selection.</dd>
    <dt>Consumer Group ID</dt><dd>Optional consumer group passed through to receive and later acknowledgement.</dd>
    <dt>Retry Delay</dt><dd>Delay after an empty short poll or receive failure, from 100 to 300000 milliseconds. The default is 5000.</dd>
</dl>
<h3>Outputs</h3>
<dl class="message-properties">
    <dt>msg.payload <span class="property-type">any</span></dt><dd>Parsed JSON when valid, otherwise the raw string content.</dd>
    <dt>msg.ociQueue <span class="property-type">object</span></dt><dd>Queue OCID, message ID, receipt, delivery count, timestamps, metadata, consumer group, and OCI request ID.</dd>
    <dt>msg.statusCode <span class="property-type">number</span></dt><dd>The OCI receive HTTP status.</dd>
    <dt>msg.error <span class="property-type">object</span></dt><dd>On receive failure, <code>{ message, code }</code> is sent to a Catch node.</dd>
</dl>
<h3>Details</h3>
<p>Batch output uses <code>msg.payload</code> as an array of decoded contents, with aligned per-message metadata and receipts in <code>msg.ociQueue.records</code> and a <code>messageCount</code>. Batches contain up to Batch Limit messages and need not be full. Preserve this metadata and process every entry before Queue Ack. One large array inside a single queue message is still subject to the service's per-message size limit.</p>
<p>This node does not auto-delete messages. Wire successful processing to <code>oci-queue-ack</code>, which uses the receipt to acknowledge explicitly. If processing fails or visibility expires, OCI Queue can redeliver the message; queue-level maximum delivery attempts and dead-letter queue settings govern exhausted messages.</p>
<p>Receive failures are reported to a Node-RED Catch node and polling resumes after Retry Delay.</p>
<p>Stopping or redeploying cancels this node's HTTP receive without waiting for the full poll timeout or affecting other nodes. Late authentication/receive completions cannot start another read or emit messages. An already accepted receive may still hide messages until visibility expires. Queue In manages receive retry/backoff without the SDK circuit breaker; the SDK may print one cancellation warning on shutdown.</p>
</script>
