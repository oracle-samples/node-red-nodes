<script type="text/javascript">
function t2MetricName(value) {
    return typeof value === "string" && /^[A-Za-z][A-Za-z0-9._$-]*$/.test(value);
}
function t2Integer(value, minimum, maximum) {
    return (typeof value === "number" || (typeof value === "string" && /^\d+$/.test(value))) &&
        Number.isInteger(Number(value)) && Number(value) >= minimum && Number(value) <= maximum;
}
function t2UnicodeLength(value) {
    var length = 0;
    for (var i = 0; i < value.length; i++, length++) {
        var code = value.charCodeAt(i);
        if (code >= 0xD800 && code <= 0xDBFF) {
            var next = value.charCodeAt(++i);
            if (!(next >= 0xDC00 && next <= 0xDFFF)) return Infinity;
        } else if (code >= 0xDC00 && code <= 0xDFFF) return Infinity;
    }
    return length;
}
function t2StringMap(value, dimensions) {
    try {
        var map = JSON.parse(value);
        if (!map || typeof map !== "object" || Array.isArray(map)) return false;
        var keys = Object.keys(map);
        if (dimensions && (keys.length < 1 || keys.length > 20)) return false;
        return keys.every(function (key) {
            return t2UnicodeLength(key) <= 256 && typeof map[key] === "string" &&
                t2UnicodeLength(map[key]) <= (dimensions ? 512 : 256) &&
                (!dimensions || (key.length > 0 && map[key].length > 0 && /^[\x21-\x7e]+$/.test(key)));
        });
    } catch (err) { return false; }
}
RED.nodes.registerType("oci-t2-publish", {
    category: "OCI Observability",
    paletteLabel: "t2 publish",
    defaults: {
        name: { value: "" },
        ociConfig: { type: "oci-config", required: true },
        compartmentOcid: { value: "" },
        namespace: { value: "", required: true, validate: function (v) {
            return typeof v === "string" && /^[A-Za-z][A-Za-z0-9_]*$/.test(v) && !/^(oci_|oracle_)/i.test(v);
        } },
        metricName: { value: "", required: true, validate: t2MetricName },
        resourceGroup: { value: "", validate: function (v) { return v === "" || t2MetricName(v); } },
        // CODEX: 2026-10-05T19:02:09Z — Require a nonempty JSON map with 1–20 string-valued dimensions.
        dimensions: { value: "{}", required: true, validate: function (v) {
            return t2StringMap(v, true);
        } },
        metadata: { value: "{}", validate: function (v) { return t2StringMap(v === "" ? "{}" : v, false); } },
        // CODEX: 2026-10-05T19:02:09Z — Validate request limits for editor-created configurations.
        maxConcurrent: { value: 4, required: true, validate: function (v) { return t2Integer(v, 1, 32); } },
        maxQueue: { value: 100, required: true, validate: function (v) { return t2Integer(v, 1, 10000); } },
        requestsPerSecond: { value: 20, required: true, validate: function (v) { return t2Integer(v, 1, 50); } },
        timeoutMs: { value: 30000, required: true, validate: function (v) { return t2Integer(v, 1000, 300000); } }
    },
    inputs: 1,
    outputs: 1,
    color: "#F0CC72",
    icon: "font-awesome/fa-line-chart",
    label: function () {
        return this.name || "t2 publish";
    }
});
</script>

<script type="text/x-red" data-help-name="oci-t2-publish">
<p>Publishes one custom metric data point to OCI Monitoring for each input message. Uses the native Monitoring API, not OpenTelemetry/OTLP.</p>

<h3>Configuration</h3>
<dl class="message-properties">
    <dt>OCI Config</dt><dd>Shared OCI authentication and region.</dd>
    <dt>Compartment OCID</dt><dd>Metric compartment. Uses the OCI Config default when blank.</dd>
    <dt>Namespace</dt><dd>Custom Monitoring namespace.</dd>
    <dt>Metric Name</dt><dd>Name of the numeric metric.</dd>
    <dt>Resource Group</dt><dd>Optional grouping within the namespace.</dd>
        <!-- CODEX: 2026-10-05T19:02:09Z — Align configuration guidance with runtime bounds. -->
    <dt>Dimensions</dt><dd>Required JSON object with 1–20 string-valued entries.</dd>
    <dt>Metadata</dt><dd>JSON object of string metadata values.</dd>
</dl>

<h3>Outputs</h3>
<dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt><dd>Publication result containing <code>failedMetricsCount</code>, <code>failedMetrics</code>, <code>opcRequestId</code>, and <code>statusCode</code>.</dd>
    <dt>statusCode <span class="property-type">number</span></dt><dd>HTTP status code, normally <code>200</code>.</dd>
    <dt>opcRequestId <span class="property-type">string</span></dt><dd>OCI request trace identifier.</dd>
    <dt>error <span class="property-type">object</span></dt><dd>On failure: <code>{ message, code }</code>. If OCI rejects the metric, the message is routed through Catch and <code>msg.payload</code> contains the rejection details.</dd>
</dl>

<h3>Inputs</h3>
<dl class="message-properties">
    <dt>timestamp <span class="property-type">string | number | Date</span></dt><dd>Required top-level observation time. Numbers are Unix milliseconds, never seconds.</dd>
    <dt>data <span class="property-type">number</span></dt><dd>Required finite numeric data point. Zero and negative values are accepted.</dd>
</dl>
<p>Example Function node: <code>msg.timestamp = new Date().toISOString(); msg.data = 42.5; return msg;</code></p>
<p>The node uses configured metric identity and dimensions. It does not read metric input from <code>msg.payload</code>. Successful output preserves <code>timestamp</code>, <code>data</code>, and other message fields, replacing <code>payload</code> with the publication result. Invalid input and service errors are routed through Catch.</p>
<p>OCI accepts timestamps less than two hours in the past and less than ten minutes in the future. The service validates this time window.</p>

<h3>Details</h3>
<p>The node uses OCI's regional <code>telemetry-ingestion</code> endpoint. Publish selected operational measurements such as latency, queue depth, availability, and failure counts; send detailed diagnostic events to OCI Logging.</p>
<!-- CODEX: 2026-10-05T19:02:09Z — Explain bounded Monitoring work and validated inputs. -->
<h3>Request limits and shutdown</h3>
<p>Default limits are 4 concurrent jobs, 100 queued messages, and 20 request starts per second. Limits are configurable. Overflow fails through Catch with <code>MonitoringQueueFull</code>; messages are not silently dropped. T2 Publish nodes sharing the same OCI Config share a 50/s operation-start cap. Other Monitoring nodes, separate OCI Config nodes and other applications need coordinated tenancy rate limits.</p>
<p>The timeout includes queued, authentication and network time (default: 30000 ms). Expired messages reach Catch with <code>MonitoringTimeout</code>. Requests are not retried automatically. A timed-out active operation keeps its concurrency slot until it settles, so a stalled provider cannot cause unlimited active work. Pending messages are held in memory; queue limits count messages, not bytes. Size limits and upstream throttling remain the flow author’s responsibility.</p>
<p>Closing the node rejects queued and pending completion promises with <code>MonitoringNodeClosed</code>, stops new dispatch, suppresses late output, and shuts down the owned client circuit breaker. Shared authentication remains available to other nodes. A request already sent to OCI may still complete remotely; shutdown does not undo it.</p>
<p>Explicit timestamp strings must have a valid calendar date and a <code>Z</code> or <code>±HH:MM</code> timezone. Date objects and Unix milliseconds are also supported.</p>
</script>
