<script type="text/javascript">
RED.nodes.registerType("oci-api-request", {
    category: "oci",
    paletteLabel: "api request",
    defaults: {
        name: { value: "" },
        ociConfig: { type: "oci-config", required: true },
        endpoint: { value: "", required: true },
        method: { value: "GET", required: true },
        path: { value: "" },
        query: { value: "{}" },
        headers: { value: "{}" },
        responseType: { value: "auto", required: true },
        timeoutMs: { value: 30000, required: true, validate: RED.validators.number() }
    },
    inputs: 1,
    outputs: 1,
    color: "#F0CC72",
    icon: "font-awesome/fa-cloud",
    label: function () {
        return this.name || "api request";
    }
});
</script>

<script type="text/x-red" data-template-name="oci-api-request">
    <div class="form-row">
        <label style="width:120px;" for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Optional display name">
    </div>
    <div class="form-row">
        <label style="width:120px;" for="node-input-ociConfig"><i class="fa fa-cloud"></i> OCI Config</label>
        <input type="text" id="node-input-ociConfig">
    </div>
    <div class="form-row">
        <label style="width:120px;" for="node-input-endpoint"><i class="fa fa-link"></i> Endpoint</label>
        <input type="text" id="node-input-endpoint" placeholder="https://&lt;service-endpoint&gt;">
        <div style="margin-left:125px;font-size:11px;color:#888;margin-top:2px;">
            Full HTTPS OCI endpoint. It is not limited by a service registry.
        </div>
    </div>
    <div class="form-row">
        <label style="width:120px;" for="node-input-method"><i class="fa fa-exchange"></i> Method</label>
        <select id="node-input-method" style="width:200px;">
            <option value="GET">GET</option>
            <option value="HEAD">HEAD</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="PATCH">PATCH</option>
            <option value="DELETE">DELETE</option>
        </select>
    </div>
    <div class="form-row">
        <label style="width:120px;" for="node-input-path"><i class="fa fa-code-fork"></i> Relative Path</label>
        <input type="text" id="node-input-path" placeholder="Optional path appended to Endpoint">
    </div>
    <div class="form-row">
        <label style="width:120px;vertical-align:top;margin-top:2px;" for="node-input-query"><i class="fa fa-filter"></i> Query</label>
        <textarea id="node-input-query" rows="4" style="width:calc(100% - 127px);font-family:monospace;" placeholder="{}"></textarea>
        <div style="margin-left:125px;font-size:11px;color:#888;margin-top:2px;">
            JSON object. Array values create repeated query parameters.
        </div>
    </div>
    <div class="form-row">
        <label style="width:120px;vertical-align:top;margin-top:2px;" for="node-input-headers"><i class="fa fa-list-alt"></i> Headers</label>
        <textarea id="node-input-headers" rows="4" style="width:calc(100% - 127px);font-family:monospace;" placeholder="{}"></textarea>
        <div style="margin-left:125px;font-size:11px;color:#888;margin-top:2px;">
            Optional request headers. Signing and host headers are protected.
        </div>
    </div>
    <div class="form-row">
        <label style="width:120px;" for="node-input-responseType"><i class="fa fa-file-code-o"></i> Response</label>
        <select id="node-input-responseType" style="width:200px;">
            <option value="auto">Automatic</option>
            <option value="json">JSON</option>
            <option value="text">Text</option>
            <option value="buffer">Buffer</option>
        </select>
    </div>
    <div class="form-row">
        <label style="width:120px;" for="node-input-timeoutMs"><i class="fa fa-clock-o"></i> Timeout (ms)</label>
        <input type="number" id="node-input-timeoutMs" min="1" max="300000" style="width:120px;">
    </div>
</script>

<script type="text/x-red" data-help-name="oci-api-request">
<p>Sends a general HTTPS request to an OCI API using the authentication and region-independent request signer from an OCI Config node.</p>

<h3>Configuration</h3>
<dl class="message-properties">
    <dt>OCI Config</dt><dd>Shared OCI authentication used to sign the request.</dd>
    <dt>Endpoint</dt><dd>Complete HTTPS OCI service endpoint. Custom and newly released OCI APIs work when their endpoint accepts OCI request signatures.</dd>
    <dt>Method</dt><dd><code>GET</code>, <code>HEAD</code>, <code>POST</code>, <code>PUT</code>, <code>PATCH</code>, or <code>DELETE</code>.</dd>
    <dt>Relative Path</dt><dd>Optional path appended to the endpoint without replacing its existing base path.</dd>
    <dt>Query</dt><dd>JSON object of query parameters. Arrays create repeated parameters.</dd>
    <dt>Headers</dt><dd>JSON object of additional headers. Authorization, host, date, content-length, body digest, and delegation-token headers cannot be overridden.</dd>
    <dt>Response</dt><dd>Automatic content-type detection, forced JSON, text, or Buffer.</dd>
    <dt>Timeout</dt><dd>Request timeout from 1 to 300000 milliseconds. Default: <code>30000</code>.</dd>
</dl>

<h3>Outputs</h3>
<dl class="message-properties">
    <dt>payload <span class="property-type">object | string | Buffer | null</span></dt><dd>Decoded OCI response body.</dd>
    <dt>statusCode <span class="property-type">number</span></dt><dd>HTTP response status.</dd>
    <dt>responseHeaders <span class="property-type">object</span></dt><dd>Response headers with lowercase names.</dd>
    <dt>opcRequestId <span class="property-type">string</span></dt><dd>OCI request trace identifier when returned.</dd>
    <dt>opcWorkRequestId <span class="property-type">string</span></dt><dd>Asynchronous work request identifier when returned.</dd>
    <dt>nextPage <span class="property-type">string</span></dt><dd>OCI pagination token when returned.</dd>
    <dt>ociUrl, ociMethod <span class="property-type">string</span></dt><dd>Effective signed request URL and method.</dd>
    <dt>error <span class="property-type">object</span></dt><dd>On failure: <code>{ message, code }</code>.</dd>
</dl>

<h3>Runtime overrides</h3>
<dl class="message-properties">
    <dt>msg.method <span class="property-type">string</span></dt><dd>Overrides the configured method.</dd>
    <dt>msg.ociPath <span class="property-type">string</span></dt><dd>Overrides the configured relative path.</dd>
    <dt>msg.ociQuery <span class="property-type">object</span></dt><dd>Overrides or adds query parameters.</dd>
    <dt>msg.ociHeaders <span class="property-type">object</span></dt><dd>Overrides or adds non-protected headers.</dd>
    <dt>msg.payload <span class="property-type">object | string</span></dt><dd>Request body for <code>POST</code>, <code>PUT</code>, and <code>PATCH</code>. Objects are serialized as JSON. Buffer bodies are rejected; use a service-specific binary transfer node.</dd>
</dl>

<h3>Details</h3>
<p>The endpoint must use a domain belonging to an OCI realm known to the installed OCI SDK. Redirects are not followed and automatic retries are not performed, preventing ambiguous write operations from being repeated. The endpoint is configured on the node and cannot be replaced by an input message.</p>
</script>
