<script type="text/x-red" data-help-name="oci-streaming-in">
<p>Consumes records from one native OCI stream through an OCI Streaming consumer group.</p>

<h3>Configuration</h3>
<dl class="message-properties">
    <dt>Streaming Config</dt><dd>References the stream and shared OCI authentication settings.</dd>
    <dt>Consumer Group ID</dt><dd>A required stable group identifier. Instances in the same group share partition reservations and committed positions.</dd>
    <dt>Instance Name</dt><dd>An optional unique name for this consumer-group member. The node generates one from its Node-RED ID when empty.</dd>
    <dt>Start Position</dt><dd>Latest starts at new records and Beginning starts at the earliest retained record. OCI uses this only when it first creates the group; an existing committed position takes precedence.</dd>
    <dt>Output Mode</dt><dd><b>Individual</b> (default) emits one message per record. <b>Batch array</b> emits one message containing an array of records from a read.</dd>
    <dt>Batch Limit</dt><dd>Maximum records requested per call in Automatic mode or Batch array mode, from 1 to 10000. Manual Individual mode requests one record at a time. OCI may return fewer records than requested.</dd>
    <dt>Commit Mode</dt><dd><b>Automatic</b> commits the prior batch on the next read. <b>Manual</b> waits for a Streaming Commit node after downstream processing succeeds.</dd>
    <dt>Retry Delay</dt><dd>Delay before retrying a failed OCI request.</dd>
</dl>

<h3>Outputs</h3>
<dl class="message-properties">
    <dt>msg.payload <span class="property-type">any | array</span></dt><dd>Parsed JSON when valid, otherwise UTF-8 text. Batch array mode emits an array of these decoded values.</dd>
    <dt class="optional">msg.ociStreaming.records <span class="property-type">array</span></dt><dd>Batch array mode only. Per-record metadata in the same order as payload, including partition, offset, decoded key and timestamp. These fields are on msg.ociStreaming itself in Individual mode.</dd>
    <dt class="optional">msg.ociStreaming.messageCount <span class="property-type">number</span></dt><dd>Number of records in the emitted batch.</dd>
    <dt>msg.statusCode <span class="property-type">number</span></dt><dd>The GetMessages HTTP status.</dd>
    <dt>msg.ociStreaming.streamOcid <span class="property-type">string</span></dt><dd>The source stream OCID.</dd>
    <dt>msg.ociStreaming.partition <span class="property-type">string</span></dt><dd>The source partition.</dd>
    <dt>msg.ociStreaming.offset <span class="property-type">number</span></dt><dd>The record position within its partition.</dd>
    <dt>msg.ociStreaming.key <span class="property-type">string | Buffer | null</span></dt><dd>The Base64-decoded record key. Binary keys remain Buffers.</dd>
    <dt>msg.ociStreaming.timestamp <span class="property-type">date</span></dt><dd>The time OCI appended the record.</dd>
    <dt>msg.ociStreaming.consumerGroupId <span class="property-type">string</span></dt><dd>The configured group ID.</dd>
    <dt>msg.ociStreaming.instanceName <span class="property-type">string</span></dt><dd>The configured or generated instance name.</dd>
    <dt>msg.ociStreaming.autoCommit <span class="property-type">boolean</span></dt><dd>Whether this source uses automatic commits.</dd>
    <dt class="optional">msg.ociStreaming.commitToken <span class="property-type">string</span></dt><dd>Manual mode only. Runtime token consumed by Streaming Commit.</dd>
    <dt class="optional">msg.ociStreaming.consumerNodeId <span class="property-type">string</span></dt><dd>Manual mode only. Identifies the active source that owns the token.</dd>
    <dt>msg.error <span class="property-type">object</span></dt><dd>On a startup, read, or heartbeat failure, <code>{ message, code }</code> is sent to a Catch node.</dd>
</dl>

<h3>Details</h3>
<p>Automatic mode commits without waiting for downstream success. Manual mode keeps one record or batch pending and sends heartbeats until Streaming Commit. Preserve the metadata and commit once after every record succeeds: a token for <code>[A, B, C]</code> commits all three even if the payload now contains only A.</p>
<p>Cursor expiry or reservation loss rejoins the same group, invalidates old tokens, and preserves committed offsets; an expired group recovers from the oldest retained records. Offsets outside retention stop consumption for administrator review and an explicit group reset/redeploy. The node does not automatically reset group positions.</p>
<p>Stop/redeploy invalidates the pending token; uncommitted work can replay, including records already processed downstream. Other commit failures retain the token for retry while its source remains active and owns it.</p>
<p>Reads start at least 210 ms apart. Request and manual processing/commit time count toward this interval; empty reads add a 1-second pause. Waits cancel on stop/redeploy. SDK retries remain enabled; Retry Delay applies after a failed request, alongside the read interval. Other consumers can still cause throttling.</p>
<p>Manual mode suppresses records at or below this running source's committed offset per partition, stream and group. Duplicate-only reads follow the next cursor with a 1-second pause; five consecutive such reads report one Catch error until progress resumes. Uncommitted records are not suppressed. Stop affected consumers before intentionally resetting a group, then restart to clear local committed history. Manual mode rejects offsets outside JavaScript's safe integer range.</p>
<p>Both modes provide at-least-once delivery. Keep downstream side effects idempotent: processing can succeed before a commit fails.</p>

<h3>Prerequisites</h3>
<p>The principal selected by Streaming Config needs <code>stream-pull</code> permission on the native OCI stream.</p>

</script>
