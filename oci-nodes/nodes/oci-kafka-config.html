<script type="text/javascript">
RED.nodes.registerType("oci-kafka-config", {
    category: "config",
    color: "#F0CC72",
    defaults: {
        name: { value: "" },
        brokers: { value: "", required: true },
        clientId: { value: "node-red-oci-kafka" },
        username: { value: "", required: true }
    },
    credentials: {
        password: { type: "password" }
    },
    label: function () {
        return this.name || this.clientId || "OCI Kafka";
    },
    oneditprepare: function () {
        var nodeId = this.id;

        setTimeout(function () {
            $("[id^='node-config-input-']").on("change input", function () {
                $("#deploy-warning")
                    .css({ background: "#fff3cd", "border-color": "#ffc107", color: "#856404" })
                    .html('<i class="fa fa-exclamation-triangle"></i> <strong>Changes detected</strong> — click <strong>Update</strong> then <strong>Deploy</strong> before testing.');
            });
        }, 0);

        $("#btn-test-kafka").on("click", function () {
            var btn = $(this);
            var resultEl = $("#test-kafka-result");
            var brokers = $("#node-config-input-brokers").val().trim();
            if (!brokers) {
                resultEl.text("Enter Bootstrap Brokers before testing").css("color", "#d62728");
                return;
            }

            btn.prop("disabled", true);
            resultEl.text("Testing...").css("color", "#888");
            $.ajax({
                url: "oci-kafka-config/" + nodeId + "/test",
                type: "POST",
                success: function (data) {
                    if (data.success) {
                        resultEl.text("\u2713 " + data.message).css("color", "#2ca02c");
                    } else {
                        resultEl.text("\u2717 " + data.message).css("color", "#d62728");
                    }
                },
                error: function (err) {
                    var message = err.status === 404
                        ? "Deploy the flow first, then test"
                        : "Test failed";
                    resultEl.text("\u2717 " + message).css("color", "#d62728");
                },
                complete: function () {
                    btn.prop("disabled", false);
                }
            });
        });
    }
});
</script>

<script type="text/x-red" data-template-name="oci-kafka-config">
    <fieldset><legend style="font-size:12px;font-weight:bold;color:#555;">Connection</legend>
        <div class="form-row">
            <label for="node-config-input-name" style="width:140px;"><i class="fa fa-tag"></i> Name</label>
            <input type="text" id="node-config-input-name" placeholder="Optional display name">
        </div>
        <div class="form-row">
            <label for="node-config-input-brokers" style="width:140px;"><i class="fa fa-server"></i> Bootstrap Brokers</label>
            <input type="text" id="node-config-input-brokers" placeholder="&lt;kafka-bootstrap-server&gt;:9092">
            <div style="margin-left:145px;font-size:11px;color:#888;margin-top:2px;">
                Comma-separated <code>host:port</code> entries from the cluster connection settings.
            </div>
        </div>
        <div class="form-row">
            <label for="node-config-input-clientId" style="width:140px;"><i class="fa fa-id-card-o"></i> Client ID</label>
            <input type="text" id="node-config-input-clientId" placeholder="node-red-oci-kafka">
            <div style="margin-left:145px;font-size:11px;color:#888;margin-top:2px;">
                Identifies this Node-RED runtime to Kafka brokers.
            </div>
        </div>
    </fieldset>

    <fieldset><legend style="font-size:12px;font-weight:bold;color:#555;">Authentication</legend>
        <div class="form-row">
            <label for="node-config-input-username" style="width:140px;"><i class="fa fa-user"></i> SASL Username</label>
            <input type="text" id="node-config-input-username" autocomplete="off">
        </div>
        <div class="form-row">
            <label for="node-config-input-password" style="width:140px;"><i class="fa fa-lock"></i> SASL Password</label>
            <input type="password" id="node-config-input-password" autocomplete="new-password">
        </div>
        <div class="form-tips" style="margin-left:145px;">
            Connections always use TLS with SASL/SCRAM-SHA-512.
        </div>
    </fieldset>

    <div class="config-test-actions">
        <div class="form-row" style="text-align:center;margin-top:12px;">
            <button type="button" class="red-ui-button" id="btn-test-kafka">
                <i class="fa fa-plug"></i> Test Kafka Connection
            </button>
            <span id="test-kafka-result" style="margin-left:10px;font-size:12px;"></span>
        </div>
        <div class="form-row" style="text-align:center;margin-top:2px;">
            <div id="deploy-warning" style="display:inline-block;font-size:11px;color:#555;background:#f4f4f4;border:1px solid #ccc;border-radius:3px;padding:5px 8px;">
                <i class="fa fa-info-circle"></i> After making changes, click <strong>Update</strong> then <strong>Deploy</strong> before testing.
            </div>
        </div>
    </div>
</script>

<script type="text/x-red" data-help-name="oci-kafka-config">
<p>Provides a shared producer connection to OCI Managed Kafka (OCI Streaming with Apache Kafka).</p>

<h3>Configuration</h3>
<dl class="message-properties">
    <dt>Bootstrap Brokers</dt>
    <dd>One or more managed Kafka broker addresses as comma-separated <code>host:port</code> entries.</dd>
    <dt>Client ID</dt>
    <dd>Identifies this Node-RED runtime to the Kafka cluster.</dd>
    <dt>SASL Username</dt>
    <dd>The SASL/SCRAM superuser name shown by the managed Kafka credential setup.</dd>
    <dt>SASL Password</dt>
    <dd>The generated password from the associated OCI Vault secret, stored in Node-RED's encrypted credential store.</dd>
    <dt>Test Kafka Connection</dt>
    <dd>Connects a producer after deploy and reports whether the broker accepted the connection.</dd>
</dl>

<h3>Authentication</h3>
<p>Connections always use TLS with SASL/SCRAM-SHA-512. Use the cluster's SASL/SCRAM superuser name and the generated password stored in its manually generated OCI Vault secret. They are not OCI API key credentials, so this config node does not reference <code>oci-config</code>.</p>

<h3>Details</h3>
<p>The connection is created on demand, shared by producer nodes that reference this config, and disconnected when the Node-RED configuration closes.</p>
</script>
