<script type="text/javascript">
RED.nodes.registerType("oci-queue-out", {
    category: "oci",
    paletteLabel: "queue out",
    defaults: {
        name: { value: "" },
        queueConfig: { type: "oci-queue-config", required: true }
    },
    inputs: 1,
    outputs: 1,
    color: "#F0CC72",
    icon: "font-awesome/fa-sign-out",
    align: "right",
    label: function () { return this.name || "queue out"; }
});
</script>

<script type="text/x-red" data-template-name="oci-queue-out">
    <div class="form-row">
        <label for="node-input-name" style="width:120px;"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Optional display name" style="width:calc(100% - 127px);">
    </div>
    <div class="form-row">
        <label for="node-input-queueConfig" style="width:120px;"><i class="fa fa-cloud"></i> Queue Config</label>
        <input type="text" id="node-input-queueConfig">
    </div>
</script>

<script type="text/x-red" data-help-name="oci-queue-out">
<p>Publishes one message or an explicit batch of up to 20 messages to OCI Queue.</p>
<h3>Configuration</h3>
<dl class="message-properties">
    <dt>Queue Config</dt><dd>References the target OCI Queue Config node.</dd>
</dl>
<h3>Outputs</h3>
<dl class="message-properties">
    <dt>msg.payload <span class="property-type">any</span></dt><dd>The unchanged input payload.</dd>
    <dt>msg.statusCode <span class="property-type">number</span></dt><dd>The OCI service HTTP status.</dd>
    <dt>msg.ociQueue.result <span class="property-type">object</span></dt><dd>The OCI put-messages result.</dd>
    <dt>msg.ociQueue.opcRequestId <span class="property-type">string</span></dt><dd>The OCI request ID.</dd>
    <dt>msg.error <span class="property-type">object</span></dt><dd>On failure, <code>{ message, code }</code>.</dd>
</dl>
<h3>Runtime overrides</h3>
<dl class="message-properties">
    <dt>msg.payload <span class="property-type">any</span></dt>
    <dd>Content for a single message. Objects and arrays are JSON-serialized. Buffers must be explicitly encoded as strings.</dd>
    <dt class="optional">msg.ociQueue.metadata <span class="property-type">object</span></dt>
    <dd>Metadata for a single message with required <code>channelId</code> and optional string-valued <code>customProperties</code>.</dd>
    <dt class="optional">msg.ociQueue.messages <span class="property-type">array</span></dt>
    <dd>Overrides the single payload with 1–20 entries shaped as <code>{ content, metadata? }</code>.</dd>
</dl>
<h3>Details</h3>
<p>The output preserves the payload and upstream properties. A successful request reports <code>enqueued N</code> using the submitted message count. Failures call <code>done(err)</code> for a Node-RED Catch node.</p>
</script>
