<script type="text/javascript">
function vaultInteger(value, minimum, maximum) {
    return (typeof value === "number" || (typeof value === "string" && /^\d+$/.test(value))) &&
        Number.isSafeInteger(Number(value)) && Number(value) >= minimum && Number(value) <= maximum;
}
RED.nodes.registerType("oci-vault-secret", {
    category: "oci", color: "#F0CC72", icon: "font-awesome/fa-key",
    paletteLabel: "vault secret", inputs: 1, outputs: 1,
    defaults: {
        name: { value: "" }, ociConfig: { type: "oci-config", required: true },
        secretId: { value: "" }, stage: { value: "CURRENT", validate: function (v) { return ["CURRENT", "PENDING", "LATEST", "PREVIOUS", "DEPRECATED"].indexOf(v) !== -1; } }, versionNumber: { value: "", validate: function (v) { return v === "" || vaultInteger(v, 1, Number.MAX_SAFE_INTEGER); } }, outputFormat: { value: "text", validate: function (v) { return ["text", "json", "buffer"].indexOf(v) !== -1; } },
        maxConcurrent: { value: 4, required: true, validate: function (v) { return vaultInteger(v, 1, 32); } },
        maxQueue: { value: 100, required: true, validate: function (v) { return vaultInteger(v, 1, 10000); } },
        timeoutMs: { value: 30000, required: true, validate: function (v) { return vaultInteger(v, 1000, 300000); } }
    },
    label: function () { return this.name || "vault secret"; }
});
</script>
<script type="text/html" data-template-name="oci-vault-secret">
    <div class="form-row">
        <label for="node-input-name" style="width:140px;"><i class="fa fa-tag"></i> Name</label>

    </div>
    <div class="form-row">
        <label for="node-input-ociConfig" style="width:140px;"><i class="fa fa-cloud"></i> OCI Config</label>
        <input type="text" id="node-input-ociConfig" style="width:calc(100% - 147px);">
    </div>
    <fieldset><legend style="font-size:12px;font-weight:bold;">Secret</legend>
    <div class="form-row">
        <label for="node-input-secretId" style="width:140px;"><i class="fa fa-key"></i> Secret OCID</label>
        <input type="text" id="node-input-secretId" placeholder="&lt;secret-ocid&gt;" style="width:calc(100% - 147px);">
        <div style="margin-left:145px;font-size:11px;margin-top:4px;">Leave blank to use <code>msg.secretId</code>.</div>
    </div>
    </fieldset>
    <fieldset><legend style="font-size:12px;font-weight:bold;">Version</legend>
    <div class="form-row">
        <label for="node-input-stage" style="width:140px;"><i class="fa fa-tag"></i> Version stage</label>
        <select id="node-input-stage" style="width:200px;"><option value="CURRENT">Current</option><option value="PENDING">Pending</option><option value="LATEST">Latest</option><option value="PREVIOUS">Previous</option><option value="DEPRECATED">Deprecated</option></select>
    </div>
    <div class="form-row">
        <label for="node-input-versionNumber" style="width:140px;"><i class="fa fa-hashtag"></i> Version number</label>
        <input type="number" id="node-input-versionNumber" placeholder="Optional" style="width:120px;" min="1" step="1">
        <div style="margin-left:145px;font-size:11px;margin-top:4px;">When set, this number takes precedence over the selected stage.</div>
    </div>

        <select id="node-input-outputFormat" style="width:200px;"><option value="text">UTF-8 text</option><option value="json">Parsed JSON</option><option value="buffer">Binary buffer</option></select>
    </div>

    <details><summary style="margin:15px 0;cursor:pointer;">Request limits</summary>
    <div class="form-row">
        <label for="node-input-maxConcurrent" style="width:140px;"><i class="fa fa-tasks"></i> Max concurrent</label>
        <input type="number" id="node-input-maxConcurrent" min="1" max="32" step="1" style="width:100px;">
    </div>
    <div class="form-row">
        <label for="node-input-maxQueue" style="width:140px;"><i class="fa fa-tasks"></i> Max queued</label>
        <input type="number" id="node-input-maxQueue" min="1" max="10000" step="1" style="width:100px;">
    </div>
    <div class="form-row">
        <label for="node-input-timeoutMs" style="width:140px;"><i class="fa fa-clock-o"></i> Timeout (ms)</label>
        <input type="number" id="node-input-timeoutMs" min="1000" max="300000" step="1" style="width:100px;">
    </div>
    <div style="margin-left:145px;font-size:11px;margin-top:4px;">Timeout includes queue, authentication and request time. Pending messages are held in memory.</div>
    </details>
    <div class="form-tips" style="margin-left:145px;">Output contains secret material. Avoid displaying <code>msg.payload</code> in Debug or saving it in flow context.</div>
</script>
<script type="text/x-red" data-help-name="oci-vault-secret">
<p>Retrieves one OCI Vault secret version through the Secrets service. OCI Config supplies the identity and region; IAM must allow reading secret bundles.</p>
<h3>Configuration</h3><p>Secret OCID, version stage (CURRENT by default) or a positive version number, and text/JSON/Buffer output. A version number takes precedence over stage.</p>
<h3>Inputs</h3><p><code>msg.secretId</code> supplies the OCID when the configured value is empty. Every input fetches the selected version; no secret is cached by this node.</p>
<h3>Outputs</h3><p><code>msg.payload</code> is decoded secret content; <code>msg.secretVersionNumber</code>, <code>msg.opcRequestId</code> and <code>msg.statusCode</code> provide metadata. Other properties and transaction references are preserved.</p>
<p>Do not attach a Debug node to the secret payload or persist it in flow context. Errors go once to scoped Catch with a sanitized <code>msg.error</code>; original SDK error bodies are omitted. An invalid JSON secret fails when JSON output is selected. This node retrieves secrets; it does not create or rotate them.</p>
<h3>Request limits</h3><p>Defaults: 4 active jobs, 100 queued messages and a 30000 ms timeout, including authentication. Overload, timeout and retrieval errors go to Catch once. Timed-out active work keeps its slot until it settles; requests are not retried automatically. Limits count messages, not bytes. Closing the node cancels pending work and suppresses late output without closing shared authentication.</p>
</script>
