<script type="text/javascript">
RED.nodes.registerType("oci-functions-invoke", {
    category: "oci",
    paletteLabel: "functions invoke",
    defaults: {
        name: { value: "" },
        ociConfig: { type: "oci-config", required: true },
        functionOcid: { value: "", required: true },
        invokeEndpoint: { value: "", required: true },
        invokeType: { value: "sync", required: true },
        intent: { value: "httprequest", required: true },
        maxResponseBytes: {
            value: 16777216,
            required: true,
            validate: function (value) {
                return (typeof value === "number" || (typeof value === "string" && value.trim() !== "")) &&
                    Number.isSafeInteger(Number(value)) && Number(value) > 0;
            }
        }
    },
    inputs: 1,
    outputs: 1,
    color: "#F0CC72",
    icon: "font-awesome/fa-bolt",
    label: function () {
        return this.name || "functions invoke";
    },
    oneditprepare: function () {
        $("#node-input-invokeType").on("change", function () {
            $("#detached-note").toggle($(this).val() === "detached");
        }).trigger("change");
    }
});
</script>

<script type="text/x-red" data-help-name="oci-functions-invoke">
<p>Invokes an OCI Function with the authentication from an OCI Config node.</p>

<h3>Configuration</h3>
<dl class="message-properties">
    <dt>OCI Config</dt><dd>References an OCI Config node for request signing.</dd>
    <dt>Function OCID</dt><dd>The default target function identifier.</dd>
    <dt>Invoke Base Endpoint</dt><dd>The HTTPS OCI Functions base origin without the function path.</dd>
    <dt>Invoke Type</dt><dd>Synchronous or detached.</dd>
    <dt>Intent</dt><dd>HTTP request or CloudEvent.</dd>
    <dt>Max Response Bytes</dt><dd>Maximum buffered successful response size. Default: 16777216 bytes (16 MiB), including saved flows without this field. Messages cannot override it. SDK-handled service error bodies are outside this limit.</dd>
</dl>

<h3>Outputs</h3>
<dl class="message-properties">
    <dt>msg.payload <span class="property-type">any</span></dt>
    <dd>The synchronous response body, parsed when it contains valid JSON. Detached invocation normally returns an empty string.</dd>
    <dt>msg.ociFunction <span class="property-type">object</span></dt>
    <dd>The resolved function OCID, invoke endpoint, <code>sync</code> or <code>detached</code> type, <code>httprequest</code> or <code>cloudevent</code> intent, and OCI request ID.</dd>
    <dt>msg.statusCode <span class="property-type">number</span></dt>
    <dd>The service HTTP status, defaulting to 200 for synchronous or 202 for detached invocation when the SDK omits it.</dd>
    <dt>msg.error <span class="property-type">object</span></dt><dd>On failure, <code>{ message, code }</code>.</dd>
</dl>

<h3>Runtime overrides</h3>
<dl class="message-properties">
    <dt>msg.payload <span class="property-type">any</span></dt><dd>The invocation body. Objects and arrays are JSON-serialized; strings and buffers are passed directly. An undefined payload sends no body.</dd>
    <dt>msg.ociFunction <span class="property-type">object</span></dt><dd>May override <code>functionOcid</code>, <code>invokeEndpoint</code>, <code>invokeType</code>, or <code>intent</code>, and may set <code>opcRequestId</code> or boolean <code>isDryRun</code>.</dd>
</dl>

<h3>Details</h3>
<p>Responses above Max Response Bytes stop reading and reach Catch with <code>OCI_RESPONSE_TOO_LARGE</code>, without normal output. The function may already have completed; this limit does not undo its work. Raise it only for trusted larger responses and available memory.</p>
<p>Detached success means OCI accepted the request, not that the function finished or succeeded. Track completion separately, or use Synchronous when the next node needs the result.</p>
<p>The endpoint requires the exact OCI Functions host structure, an SDK-known OCI realm domain, the default HTTPS port, and no function path. Validation runs before credentials are requested.</p>
<p>Upstream properties are preserved. Invocation failures reach a Node-RED Catch node.</p>

</script>
