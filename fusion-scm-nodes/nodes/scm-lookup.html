<script type="text/javascript">
function _parseScmLookupCustomUrl(urlValue) {
    var parsedUrl = new URL(String(urlValue || "").trim());
    if (parsedUrl.hash) {
        throw new Error("Custom URL must not contain a fragment");
    }
    if (parsedUrl.username || parsedUrl.password) {
        throw new Error("Custom URL must not contain credentials");
    }

    var queryParams = [];
    parsedUrl.searchParams.forEach(function (value, name) {
        queryParams.push({ name: name, value: value });
    });
    parsedUrl.search = "";

    return {
        baseUrl: parsedUrl.toString(),
        queryParams: queryParams
    };
}

function _buildScmLookupCustomUrl(baseUrl, queryParams) {
    var parsedUrl = new URL(String(baseUrl || "").trim());
    var params = Array.isArray(queryParams) ? queryParams : [];
    if (parsedUrl.hash) {
        throw new Error("Custom URL must not contain a fragment");
    }
    if (parsedUrl.username || parsedUrl.password) {
        throw new Error("Custom URL must not contain credentials");
    }
    if (parsedUrl.search && params.length > 0) {
        throw new Error("Use either the URL query string or Query Parameters, not both");
    }

    if (!parsedUrl.search) {
        params.forEach(function (param) {
            if (!param || !/^[A-Za-z][A-Za-z0-9_.-]*$/.test(param.name || "")) {
                throw new Error("Query parameter names must start with a letter");
            }
            parsedUrl.searchParams.append(
                param.name,
                param.value === undefined || param.value === null ? "" : String(param.value)
            );
        });
    }
    return parsedUrl.toString();
}

RED.nodes.registerType("scm-lookup", {
    category: "oracle fusion scm",
    paletteLabel: "scm lookup",
    defaults: {
        name: { value: "" },
        server: { type: "scm-server", required: true },
        lookupType: { value: "custom" },
        organizationQueryField: { value: "OrganizationName" },
        workOrderId: { value: "" },
        workOrderOperationId: { value: "" },
        organizationCode: { value: "" },
        itemNumber: { value: "" },
        meterCode: { value: "" },
        subinventoryCode: { value: "" },
        queryValue: { value: "" },
        queryFilters: { value: "" },
        customUrl: { value: "" },
        customQueryParams: { value: "" }
    },
    inputs: 1, outputs: 1,
    color: "#4F7D7B",
    icon: "font-awesome/fa-search",
    label: function () {
        if (this.name) return this.name;
        var labels = {
            installedBaseAsset: "lookup asset",
            meterReading: "lookup meter",
            organizationId: "lookup organization",
            item: "lookup item",
            subinventory: "lookup subinventory",
            onHandQuantity: "lookup on-hand",
            workDefinition: "lookup work def",
            recipe: "lookup recipe",
            manufacturingWorkOrder: "lookup mfg WO",
            batch: "lookup batch",
            workOrderOperation: "lookup batch op",
            workOrderMaterial: "lookup batch material",
            workOrderResource: "lookup batch resource",
            workOrderOutput: "lookup batch output",
            reservationStatus: "lookup reservation",
            maintenanceWorkOrder: "lookup maint WO",
            custom: "scm lookup"
        };
        return labels[this.lookupType] || "scm lookup";
    },
    oneditprepare: function () {
        var node = this;
        var endpointMap = {
            installedBaseAsset: "installedBaseAssets",
            meterReading: "meterReadings",
            organizationId: "inventoryOrganizations",
            item: "itemsV2",
            subinventory: "subinventories",
            onHandQuantity: "inventoryOnhandBalances",
            workDefinition: "workDefinitions",
            recipe: "workDefinitions",
            manufacturingWorkOrder: "workOrders",
            batch: "workOrders",
            workOrderOperation: "workOrders/{WorkOrderId}/child/WorkOrderOperation",
            workOrderMaterial: "workOrders/{WorkOrderId}/child/WorkOrderOperation/{WorkOrderOperationId}/child/WorkOrderOperationMaterial",
            workOrderResource: "workOrders/{WorkOrderId}/child/WorkOrderOperation/{WorkOrderOperationId}/child/WorkOrderOperationResource",
            workOrderOutput: "workOrders/{WorkOrderId}/child/WorkOrderOperation/{WorkOrderOperationId}/child/WorkOrderOperationOutput",
            reservationStatus: "workOrders/{WorkOrderId}/child/WorkOrderOperation/{WorkOrderOperationId}/child/WorkOrderOperationMaterial",
            maintenanceWorkOrder: "maintenanceWorkOrders"
        };
        var queryParamMap = {
            installedBaseAsset: "SerialNumber",
            organizationId: "OrganizationName",
            item: "ItemNumber",
            subinventory: "SecondaryInventoryName",
            onHandQuantity: "ItemNumber",
            workDefinition: "WorkDefinitionName",
            recipe: "WorkDefinitionName",
            manufacturingWorkOrder: "WorkOrderNumber",
            batch: "WorkOrderNumber",
            workOrderOperation: "OperationSequenceNumber",
            workOrderMaterial: "InventoryItemNumber",
            workOrderResource: "ResourceCode",
            workOrderOutput: "InventoryItemNumber",
            reservationStatus: "InventoryItemNumber",
            maintenanceWorkOrder: "WorkOrderNumber"
        };
        var dedicatedQueryFieldMap = {
            installedBaseAsset: [{ id: "itemNumber", queryParam: "ItemNumber" }],
            meterReading: [{ id: "meterCode", queryParam: "MeterCode" }],
            item: [{ id: "organizationCode", queryParam: "OrganizationCode" }],
            subinventory: [{ id: "organizationCode", queryParam: "OrganizationCode" }],
            onHandQuantity: [
                { id: "organizationCode", queryParam: "OrganizationCode" },
                { id: "subinventoryCode", queryParam: "SubinventoryCode" }
            ],
            workDefinition: [
                { id: "organizationCode", queryParam: "OrganizationCode" },
                { id: "itemNumber", queryParam: "ItemNumber" }
            ],
            recipe: [
                { id: "organizationCode", queryParam: "OrganizationCode" },
                { id: "itemNumber", queryParam: "ItemNumber" }
            ],
            manufacturingWorkOrder: [{ id: "organizationCode", queryParam: "OrganizationCode" }],
            batch: [{ id: "organizationCode", queryParam: "OrganizationCode" }],
            maintenanceWorkOrder: [{ id: "organizationCode", queryParam: "OrganizationCode" }]
        };

        function readSavedCustomQueryParams() {
            if (!node.customQueryParams) return [];
            try {
                var saved = JSON.parse(node.customQueryParams);
                return Array.isArray(saved) ? saved : [];
            } catch (e) {
                return [];
            }
        }

        function collectCustomQueryParams() {
            var params = [];
            $("#custom-query-params-container .custom-query-param-row").each(function () {
                var $row = $(this);
                var name = String($row.find(".custom-query-param-name").val() || "").trim();
                var value = String($row.find(".custom-query-param-value").val() || "");
                if (name || value) {
                    params.push({ name: name, value: value });
                }
            });
            return params;
        }

        function addCustomQueryParamRow(param) {
            var $row = $("<div>", {
                "class": "custom-query-param-row",
                style: "display:flex;gap:6px;margin-bottom:6px;align-items:center;"
            });
            $("<input>", {
                type: "text",
                "class": "custom-query-param-name",
                placeholder: "Parameter name",
                style: "width:180px;"
            }).val(param && param.name ? param.name : "").appendTo($row);
            $("<input>", {
                type: "text",
                "class": "custom-query-param-value",
                placeholder: "Complete parameter value",
                style: "flex:1;min-width:0;"
            }).val(param && param.value !== undefined ? param.value : "").appendTo($row);
            $("<button>", {
                type: "button",
                "class": "editor-button custom-query-param-remove",
                title: "Remove query parameter",
                style: "width:34px;"
            }).append($("<i>", { "class": "fa fa-trash" })).appendTo($row);
            $("#custom-query-params-container").append($row);
        }

        function renderCustomQueryParams(params) {
            $("#custom-query-params-container").empty();
            (params || []).forEach(addCustomQueryParamRow);
        }

        function normalizeCustomEndpoint() {
            var customUrl = $("#node-input-customUrl").val().trim();
            if (!customUrl || customUrl.indexOf("?") === -1) {
                updateEndpointPreview();
                return;
            }
            try {
                var parsed = _parseScmLookupCustomUrl(customUrl);
                $("#node-input-customUrl").val(parsed.baseUrl);
                renderCustomQueryParams(parsed.queryParams);
            } catch (e) {
                $("#lookup-endpoint-display").text(e.message);
                return;
            }
            updateEndpointPreview();
        }

        function buildFilterSuffix(lookupType) {
            var raw = $("#node-input-queryFilters").val().trim();
            if (!raw) return "";
            var filters;
            try {
                filters = JSON.parse(raw);
            } catch (e) {
                return null;
            }
            if (!filters || typeof filters !== "object" || Array.isArray(filters)) {
                return null;
            }
            var parts = [];
            var dedicatedFields = dedicatedQueryFieldMap[lookupType] || [];
            var dedicatedParams = dedicatedFields.map(function (field) { return field.queryParam; });
            Object.keys(filters).forEach(function (key) {
                if (!/^[A-Za-z][A-Za-z0-9_.]*$/.test(key)) {
                    parts = null;
                    return;
                }
                if (parts === null) return;
                var value = filters[key];
                if (dedicatedParams.indexOf(key) === -1 && value !== undefined && value !== null && value !== "") {
                    parts.push(key + "=" + value);
                }
            });
            if (parts === null) return null;
            return parts.length > 0 ? ";" + parts.join(";") : "";
        }

        function buildDedicatedFilterSuffix(lookupType) {
            var parts = [];
            (dedicatedQueryFieldMap[lookupType] || []).forEach(function (field) {
                var value = $("#node-input-" + field.id).val().trim();
                if (value) {
                    parts.push(field.queryParam + "=" + value);
                }
            });
            return parts.length > 0 ? ";" + parts.join(";") : "";
        }

        function updateEndpointPreview() {
            var lookupType = $("#node-input-lookupType").val();
            var $endpoint = $("#lookup-endpoint-display");
            var queryValue = $("#node-input-queryValue").val().trim();

            if (lookupType === "custom") {
                var customUrl = $("#node-input-customUrl").val().trim();
                if (!customUrl) {
                    $endpoint.text("Enter Custom URL to preview endpoint");
                    return;
                }
                try {
                    $endpoint.text(
                        _buildScmLookupCustomUrl(customUrl, collectCustomQueryParams())
                    );
                } catch (e) {
                    $endpoint.text(e.message);
                }
                return;
            }

            var filterSuffix = buildFilterSuffix(lookupType);
            if (filterSuffix === null) {
                $endpoint.text("Additional Filters JSON is invalid");
                return;
            }

            var serverNodeId = $("#node-input-server").val();
            var serverNode = RED.nodes.node(serverNodeId);
            if (!serverNode || !serverNode.hostname || !serverNode.version) {
                $endpoint.text("Select SCM Server to preview endpoint");
                return;
            }

            var endpoint = endpointMap[lookupType];
            var workOrderId = $("#node-input-workOrderId").val().trim();
            var workOrderOperationId = $("#node-input-workOrderOperationId").val().trim();
            endpoint = endpoint.replace(
                "{WorkOrderId}",
                workOrderId ? encodeURIComponent(workOrderId) : "{msg.workOrderId}"
            ).replace(
                "{WorkOrderOperationId}",
                workOrderOperationId ? encodeURIComponent(workOrderOperationId) : "{msg.workOrderOperationId}"
            );
            var queryParam = lookupType === "organizationId"
                ? $("#node-input-organizationQueryField").val()
                : (queryParamMap[lookupType] || "q");
            var base = "https://" + serverNode.hostname + "/fscmRestApi/resources/" + serverNode.version + "/" + endpoint;
            if (lookupType === "meterReading") {
                var meterCode = $("#node-input-meterCode").val().trim();
                if (!queryValue || !meterCode) {
                    $endpoint.text(base);
                    return;
                }
                var finder = "MetersByAssetMeterUserKey;MntAssetNumber=" +
                    queryValue + ",MntMeterCode=" + meterCode;
                var meterUrl = base + "?finder=" + encodeURIComponent(finder);
                if (filterSuffix) {
                    meterUrl += "&q=" + encodeURIComponent(filterSuffix.substring(1));
                }
                $endpoint.text(meterUrl);
                return;
            }
            var dedicatedFilterSuffix = buildDedicatedFilterSuffix(lookupType);
            $endpoint.text(queryValue ? base + "?q=" + queryParam + "=" + queryValue + dedicatedFilterSuffix + filterSuffix : base);
        }

        function updateSections() {
            var type = $("#node-input-lookupType").val();
            var isCustom = (type === "custom");
            var usesWorkOrderId = ["workOrderOperation", "workOrderMaterial", "workOrderResource", "workOrderOutput", "reservationStatus"].indexOf(type) !== -1;
            var usesOperationId = ["workOrderMaterial", "workOrderResource", "workOrderOutput", "reservationStatus"].indexOf(type) !== -1;
            $(".custom-section").toggle(isCustom);
            $(".predefined-query-section").toggle(!isCustom);
            $(".query-filters-section").toggle(!isCustom);
            $(".organization-query-section").toggle(type === "organizationId");
            $(".work-order-id-section").toggle(usesWorkOrderId);
            $(".work-order-operation-id-section").toggle(usesOperationId);
            $(".organization-code-section").toggle([
                "item", "subinventory", "onHandQuantity", "workDefinition", "recipe",
                "manufacturingWorkOrder", "batch", "maintenanceWorkOrder"
            ].indexOf(type) !== -1);
            $(".item-number-section").toggle(["installedBaseAsset", "workDefinition", "recipe"].indexOf(type) !== -1);
            $(".meter-code-section").toggle(type === "meterReading");
            $(".subinventory-code-section").toggle(type === "onHandQuantity");
            var labelMap = {
                installedBaseAsset: "Serial Number",
                meterReading: "Asset Number",
                organizationId: $("#node-input-organizationQueryField option:selected").text(),
                item: "Item Number",
                subinventory: "Subinventory Code",
                onHandQuantity: "Item Number",
                workDefinition: "Work Definition Name",
                recipe: "Recipe / Work Definition Name",
                manufacturingWorkOrder: "Work Order Number",
                batch: "Batch / Work Order Number",
                workOrderOperation: "Operation Sequence Number",
                workOrderMaterial: "Material / Ingredient Item Number",
                workOrderResource: "Resource Code",
                workOrderOutput: "Output Product Item Number",
                reservationStatus: "Reserved Material Item Number",
                maintenanceWorkOrder: "Work Order Number"
            };
            $("#query-value-label").text(labelMap[type] || "Query Value");
            updateEndpointPreview();
        }

        renderCustomQueryParams(readSavedCustomQueryParams());
        if (
            $("#node-input-customUrl").val().indexOf("?") !== -1 &&
            collectCustomQueryParams().length === 0
        ) {
            normalizeCustomEndpoint();
        }
        node._collectScmLookupCustomQueryParams = collectCustomQueryParams;

        updateSections();
        $("#node-input-lookupType").on("change", updateSections);
        $("#node-input-organizationQueryField").on("change", updateSections);
        $("#node-input-server").on("change", updateEndpointPreview);
        $("#node-input-customUrl").on("input", updateEndpointPreview);
        $("#node-input-customUrl").on("change", normalizeCustomEndpoint);
        $("#node-input-customUrl").on("paste", function () {
            setTimeout(normalizeCustomEndpoint, 0);
        });
        $("#add-custom-query-param").on("click", function () {
            addCustomQueryParamRow({ name: "", value: "" });
            updateEndpointPreview();
        });
        $("#custom-query-params-container").on(
            "input",
            ".custom-query-param-name, .custom-query-param-value",
            updateEndpointPreview
        );
        $("#custom-query-params-container").on(
            "click",
            ".custom-query-param-remove",
            function () {
                $(this).closest(".custom-query-param-row").remove();
                updateEndpointPreview();
            }
        );
        $("#node-input-workOrderId").on("input", updateEndpointPreview);
        $("#node-input-workOrderOperationId").on("input", updateEndpointPreview);
        $("#node-input-organizationCode").on("input", updateEndpointPreview);
        $("#node-input-itemNumber").on("input", updateEndpointPreview);
        $("#node-input-meterCode").on("input", updateEndpointPreview);
        $("#node-input-subinventoryCode").on("input", updateEndpointPreview);
        $("#node-input-queryValue").on("input", updateEndpointPreview);
        $("#node-input-queryFilters").on("input", updateEndpointPreview);
        updateEndpointPreview();
    },
    oneditsave: function () {
        var customQueryParams = this._collectScmLookupCustomQueryParams
            ? this._collectScmLookupCustomQueryParams()
            : [];
        var savedCustomQueryParams = JSON.stringify(customQueryParams);
        $("#node-input-customQueryParams").val(savedCustomQueryParams);
        this.customQueryParams = savedCustomQueryParams;
        delete this._collectScmLookupCustomQueryParams;
    }
});
</script>

<script type="text/x-red" data-template-name="scm-lookup">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-server"><i class="fa fa-globe"></i> SCM Server</label>
        <input type="text" id="node-input-server">
    </div>
    <hr/>
    <div class="form-row">
        <label for="node-input-lookupType"><i class="fa fa-list"></i> Lookup Type</label>
        <select id="node-input-lookupType" style="width:200px;">
            <option value="custom">Custom</option>
            <option value="installedBaseAsset">Installed Base Asset</option>
            <option value="meterReading">Meter Reading</option>
            <option value="organizationId">Inventory Organization</option>
            <option value="item">Item</option>
            <option value="subinventory">Subinventory</option>
            <option value="onHandQuantity">On-Hand Quantity</option>
            <option value="workDefinition">Work Definition</option>
            <option value="recipe">Recipe / Work Definition</option>
            <option value="manufacturingWorkOrder">Manufacturing Work Order</option>
            <option value="batch">Batch / Manufacturing Work Order</option>
            <option value="workOrderOperation">Batch Operation by Sequence</option>
            <option value="workOrderMaterial">Batch Material / Ingredient Line</option>
            <option value="workOrderResource">Batch Resource Line</option>
            <option value="workOrderOutput">Batch Output Product Line</option>
            <option value="reservationStatus">Batch Material Reservation Status</option>
            <option value="maintenanceWorkOrder">Maintenance Work Order</option>
        </select>
    </div>
    <div class="form-row work-order-id-section" style="display:none;">
        <label for="node-input-workOrderId"><i class="fa fa-key"></i> Work Order ID</label>
        <input type="text" id="node-input-workOrderId" placeholder="Fusion work order resource ID">
        <div style="margin-left:105px;font-size:11px;color:#888;margin-top:2px;">Required for this lookup. This is the Fusion resource ID, not the displayed work order or batch number. <code>msg.workOrderId</code> overrides this field.</div>
    </div>
    <div class="form-row work-order-operation-id-section" style="display:none;">
        <label for="node-input-workOrderOperationId"><i class="fa fa-key"></i> Operation ID</label>
        <input type="text" id="node-input-workOrderOperationId" placeholder="Fusion operation resource ID">
        <div style="margin-left:105px;font-size:11px;color:#888;margin-top:2px;">Required for this nested lookup. This is the Fusion operation resource ID, not the operation sequence. <code>msg.workOrderOperationId</code> overrides this field.</div>
    </div>
    <div class="form-row organization-query-section">
        <label for="node-input-organizationQueryField"><i class="fa fa-filter"></i> Find by</label>
        <select id="node-input-organizationQueryField" style="width:200px;">
            <option value="OrganizationName">Organization Name</option>
            <option value="OrganizationCode">Organization Code</option>
            <option value="OrganizationId">Organization ID</option>
        </select>
        <div style="margin-left:105px;font-size:11px;color:#888;">Controls the Fusion query field. The output remains the full inventory organization response.</div>
    </div>
    <hr/>
    <div class="custom-section scm-custom-endpoint-section" style="display:none;">
        <div class="form-row">
            <label for="node-input-customUrl" style="width:125px;vertical-align:top;margin-top:2px;"><i class="fa fa-pencil"></i> Custom Endpoint</label>
            <textarea id="node-input-customUrl" rows="3" style="width:calc(100% - 132px);font-family:monospace;font-size:12px;" placeholder="https://hostname/fscmRestApi/resources/version/endpoint"></textarea>
            <div style="margin-left:130px;font-size:11px;color:#888;margin-top:2px;">Paste a complete Fusion GET URL or enter its base endpoint. A pasted query string is moved into the editable rows below.</div>
        </div>
        <div class="form-row">
            <label style="width:125px;vertical-align:top;margin-top:2px;"><i class="fa fa-filter"></i> Query Parameters</label>
            <div style="display:inline-block;width:calc(100% - 132px);">
                <input type="hidden" id="node-input-customQueryParams">
                <div id="custom-query-params-container"></div>
                <button type="button" class="editor-button" id="add-custom-query-param">
                    <i class="fa fa-plus"></i> Add Parameter
                </button>
            </div>
            <div style="margin-left:130px;font-size:11px;color:#888;margin-top:2px;">Optional ordered parameters such as <code>finder</code>, <code>q</code>, <code>fields</code>, <code>limit</code>, or <code>offset</code>. Repeated names are preserved.</div>
        </div>
    </div>
    <div class="form-row">
        <label><i class="fa fa-link"></i> Endpoint</label>
        <span id="lookup-endpoint-display" class="scm-endpoint-preview" style="font-size:12px;color:#555;word-break:break-all;">Select SCM Server to preview endpoint</span>
    </div>
    <hr/>
    <div class="form-row predefined-query-section">
        <label for="node-input-queryValue" style="width:160px;"><i class="fa fa-hashtag"></i> <span id="query-value-label">Serial Number</span></label>
        <input type="text" id="node-input-queryValue" style="width:calc(100% - 167px);">
        <div style="margin-left:165px;font-size:11px;color:#888;margin-top:2px;">Leave empty to read from <code>msg.queryValue</code>.</div>
    </div>
    <div class="form-row organization-code-section" style="display:none;">
        <label for="node-input-organizationCode" style="width:160px;"><i class="fa fa-building"></i> Organization Code</label>
        <input type="text" id="node-input-organizationCode" style="width:calc(100% - 167px);">
        <div style="margin-left:165px;font-size:11px;color:#888;margin-top:2px;">Required for this lookup. Leave empty to read from <code>msg.organizationCode</code>.</div>
    </div>
    <div class="form-row item-number-section" style="display:none;">
        <label for="node-input-itemNumber" style="width:160px;"><i class="fa fa-cube"></i> Item Number</label>
        <input type="text" id="node-input-itemNumber" style="width:calc(100% - 167px);">
        <div style="margin-left:165px;font-size:11px;color:#888;margin-top:2px;">Required for this lookup. Leave empty to read from <code>msg.itemNumber</code>.</div>
    </div>
    <div class="form-row meter-code-section" style="display:none;">
        <label for="node-input-meterCode" style="width:160px;"><i class="fa fa-tachometer"></i> Meter Code</label>
        <input type="text" id="node-input-meterCode" style="width:calc(100% - 167px);">
        <div style="margin-left:165px;font-size:11px;color:#888;margin-top:2px;">Required for this lookup. Leave empty to read from <code>msg.meterCode</code>.</div>
    </div>
    <div class="form-row subinventory-code-section" style="display:none;">
        <label for="node-input-subinventoryCode" style="width:160px;"><i class="fa fa-archive"></i> Subinventory Code</label>
        <input type="text" id="node-input-subinventoryCode" style="width:calc(100% - 167px);">
        <div style="margin-left:165px;font-size:11px;color:#888;margin-top:2px;">Optional on-hand scope. Leave empty to read from <code>msg.subinventoryCode</code>.</div>
    </div>
    <div class="form-row query-filters-section">
        <label for="node-input-queryFilters" style="width:160px;vertical-align:top;margin-top:2px;"><i class="fa fa-filter"></i> Additional Filters</label>
        <textarea id="node-input-queryFilters" rows="4" style="width:calc(100% - 167px);font-family:monospace;font-size:12px;"></textarea>
        <div style="margin-left:165px;font-size:11px;color:#888;margin-top:2px;">Optional JSON object appended to the REST <code>q</code> expression for extra narrowing. Field names may contain letters, numbers, underscores, and dots. Dedicated fields above take precedence over matching keys. Values containing <code>;</code> are rejected. Can be overridden by <code>msg.queryFilters</code>.</div>
    </div>
</script>

<script type="text/x-red" data-help-name="scm-lookup">
<p>Performs a GET lookup against Oracle Fusion SCM REST endpoints. Supports common lookups (assets, meters, organizations) and custom endpoints.</p>

<h3>Configuration</h3>
<dl class="message-properties">
    <dt>SCM Server</dt><dd>Server configuration for authentication and connection.</dd>
    <dt>Lookup Type</dt><dd>Selects the REST endpoint and query parameter:
        <ul>
            <li><b>Installed Base Asset</b> — queries by SerialNumber and ItemNumber</li>
            <li><b>Meter Reading</b> — uses <code>MetersByAssetMeterUserKey</code> with Asset Number and Meter Code and returns the complete reading history</li>
            <li><b>Inventory Organization</b> — queries by the selected Organization Name, Organization Code, or Organization ID field and returns the full matching record</li>
            <li><b>Item</b> — queries itemsV2 by ItemNumber and OrganizationCode</li>
            <li><b>Subinventory</b> — queries subinventories by SecondaryInventoryName and OrganizationCode</li>
            <li><b>On-Hand Quantity</b> — queries inventoryOnhandBalances by ItemNumber and OrganizationCode, optionally scoped by SubinventoryCode</li>
            <li><b>Work Definition</b> — queries workDefinitions by WorkDefinitionName, OrganizationCode, and ItemNumber</li>
            <li><b>Recipe / Work Definition</b> — Redwood alias for Work Definition with the same required fields</li>
            <li><b>Manufacturing Work Order</b> — queries workOrders by WorkOrderNumber and OrganizationCode</li>
            <li><b>Batch / Manufacturing Work Order</b> — Redwood alias for Manufacturing Work Order with the same required fields</li>
            <li><b>Batch Operation by Sequence</b> — queries a work order operation by OperationSequenceNumber. Requires <code>WorkOrderId</code>.</li>
            <li><b>Batch Material / Ingredient Line</b> — queries operation materials by InventoryItemNumber. Requires <code>WorkOrderId</code> and <code>WorkOrderOperationId</code>.</li>
            <li><b>Batch Resource Line</b> — queries operation resources by ResourceCode. Requires <code>WorkOrderId</code> and <code>WorkOrderOperationId</code>.</li>
            <li><b>Batch Output Product Line</b> — queries operation outputs by InventoryItemNumber. Requires <code>WorkOrderId</code> and <code>WorkOrderOperationId</code>.</li>
            <li><b>Batch Material Reservation Status</b> — reads operation material lines, including reservation fields such as <code>ReservedQuantity</code>. Requires <code>WorkOrderId</code> and <code>WorkOrderOperationId</code>.</li>
            <li><b>Maintenance Work Order</b> — queries maintenanceWorkOrders by WorkOrderNumber and OrganizationCode</li>
            <li><b>Custom</b> — paste a complete Fusion GET URL, or enter a base endpoint and optional ordered Query Parameters. Pasted query strings are normalized into editable rows.</li>
        </ul>
    </dd>
    <dt>Work Order ID</dt><dd>Fusion resource ID for the parent work order. Required by manufacturing child lookups. This is not the displayed work order or batch number.</dd>
    <dt>Operation ID</dt><dd>Fusion resource ID for the parent operation. Required by material, resource, output, and reservation child lookups. This is not the operation sequence.</dd>
    <dt>Organization Code</dt><dd>Required organization scope for item, inventory, work definition/recipe, manufacturing work order/batch, and maintenance work order lookups.</dd>
    <dt>Item Number</dt><dd>Required with Installed Base Asset and Work Definition/Recipe lookups.</dd>
    <dt>Meter Code</dt><dd>Required with Meter Reading lookups and combined with Asset Number in the documented business-key finder.</dd>
    <dt>Subinventory Code</dt><dd>Optional subinventory scope for On-Hand Quantity lookups.</dd>
    <dt>Custom Endpoint</dt><dd>Complete Fusion GET URL or base resource endpoint for Custom mode. It must use HTTPS and remain within the configured SCM Server origin and API-version resource path.</dd>
    <dt>Query Parameters</dt><dd>Optional static Custom-mode rows. Names such as <code>finder</code>, <code>q</code>, <code>fields</code>, <code>limit</code>, and <code>offset</code> use the same mechanism; order and repeated names are preserved.</dd>
    <dt>Query Value</dt><dd>The primary value for predefined lookups. If left blank, reads from <code>msg.queryValue</code>.</dd>
    <dt>Additional Filters</dt><dd>Optional JSON object appended as a REST <code>q</code> expression for predefined lookups. Field names may contain letters, numbers, underscores, and dots; values containing <code>;</code> are rejected. Dedicated lookup fields take precedence over matching keys.</dd>
    <dt>Endpoint</dt><dd>Read-only preview of the complete request URL.</dd>
</dl>

<h3>Outputs</h3>
<dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt><dd>API response body containing matching records.</dd>
    <dt>statusCode <span class="property-type">number</span></dt><dd>HTTP status code.</dd>
    <dt>error <span class="property-type">object</span></dt><dd>Error details on failure: <code>{ message, code }</code>.</dd>
</dl>

<h3>Runtime overrides</h3>
<dl class="message-properties">
    <dt>msg.queryValue <span class="property-type">string</span></dt><dd>Overrides the Query Value for predefined lookups.</dd>
    <dt>msg.queryFilters <span class="property-type">object|string</span></dt><dd>Overrides Additional Filters for predefined lookups. Provide an object or a JSON object string.</dd>
    <dt>msg.organizationCode <span class="property-type">string</span></dt><dd>Overrides Organization Code for lookup types that require organization scope.</dd>
    <dt>msg.itemNumber <span class="property-type">string</span></dt><dd>Overrides Item Number for asset and work definition/recipe lookups.</dd>
    <dt>msg.meterCode <span class="property-type">string</span></dt><dd>Overrides Meter Code for meter reading lookups.</dd>
    <dt>msg.subinventoryCode <span class="property-type">string</span></dt><dd>Overrides the optional Subinventory Code for on-hand lookups.</dd>
    <dt>msg.workOrderId <span class="property-type">string|number</span></dt><dd>Overrides Work Order ID for manufacturing child lookups.</dd>
    <dt>msg.workOrderOperationId <span class="property-type">string|number</span></dt><dd>Overrides Operation ID for material, resource, output, and reservation child lookups.</dd>
</dl>

<h3>Details</h3>
<p>A unified lookup node that replaces the need for separate get-ib-asset, get-meter-reading,
and get-organization-id nodes. Select a lookup type to auto-configure the endpoint, or use
Custom mode for a GET request to a resource under the configured Fusion REST base. A Custom
request may be parameterless. Query Parameters are static node configuration; use a predefined
lookup or the Fusion Request node when values must come from each incoming message.</p>
<p>Custom URLs cannot contain credentials or fragments, must match the configured origin and
API version exactly, and do not follow redirects. These restrictions prevent the SCM bearer
token from being sent outside the configured Fusion REST boundary.</p>
<p>Required business keys and organization scope are shown as dedicated fields for each predefined lookup.
Use Additional Filters only for optional criteria beyond those fields.</p>
<p>Primary Query Values and Additional Filter values containing <code>;</code> are rejected because Fusion uses semicolons to separate <code>q</code> filter expressions.</p>
<p>Meter Reading lookups fetch every Fusion page. For multi-page results, the node returns one normalized
collection: <code>items</code> and <code>count</code> cover the full history, <code>hasMore</code> is false,
<code>offset</code> is zero, <code>limit</code> remains the Fusion page size, and page-specific
<code>links</code> are omitted.</p>
</script>
