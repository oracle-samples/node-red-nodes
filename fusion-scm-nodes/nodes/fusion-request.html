<script type="text/javascript">
RED.nodes.registerType("fusion-request", {
    category: "oracle fusion scm",
    paletteLabel: "fusion request",
    defaults: {
        name: { value: "" },
        server: { type: "scm-server", required: true },
        transactionType: { value: "custom" },
        method: { value: "POST" },
        requestMediaType: { value: "resourceItem" },
        customPath: { value: "" },
        payloadSource: { value: "mappings" },
        mappings: { value: "[]" }
    },
    inputs: 1, outputs: 1, color: "#4F7D7B", icon: "font-awesome/fa-cogs",
    label: function () {
        if (this.name) return this.name;
        var labels = {
            createAsset: "create asset",
            createMeterReading: "create meter reading",
            miscTransaction: "miscellaneous transaction",
            subinventoryQuantityTransfer: "subinventory transfer",
            custom: "fusion request"
        };
        return labels[this.transactionType] || "fusion request";
    },
    oneditprepare: function () {
        var node = this;
        function syncPayloadSource() {
            var useMappings = ($("#node-input-payloadSource").val() || "mappings") === "mappings";
            $(".scm-payload-mappings").toggle(useMappings);
            $(".scm-direct-payload-hint").toggle(!useMappings);
        }
        function messageMapping(field) {
            return {scmField:field,sourceType:"msg",value:"payload." + field};
        }

        // Default mapping templates per transaction type
        var defaultMappings = {
            createAsset: [
                messageMapping("AssetNumber"),
                messageMapping("Description"),
                messageMapping("ItemNumber"),
                messageMapping("OperatingOrganizationCode"),
                messageMapping("CurrentLocationContextCode"),
                messageMapping("Quantity"),
                messageMapping("MaintainableFlag"),
                messageMapping("NewWoAllowedFlag")
            ],
            createMeterReading: [
                messageMapping("AssetNumber"),
                messageMapping("MeterCode"),
                {scmField:"ReadingDate",sourceType:"currentTimestamp",value:""},
                {scmField:"MeterUsageCode",sourceType:"static",value:"ORA_ASSET"},
                messageMapping("ReadingValue"),
                messageMapping("Comments")
            ],
            miscTransaction: [
                messageMapping("SourceCode"),
                messageMapping("SourceHeaderId"),
                messageMapping("SourceLineId"),
                messageMapping("TransactionMode"),
                messageMapping("UseCurrentCostFlag"),
                messageMapping("TransactionTypeName"),
                messageMapping("OrganizationId"),
                messageMapping("ItemNumber"),
                messageMapping("TransactionQuantity"),
                messageMapping("TransactionUnitOfMeasure"),
                {scmField:"TransactionDate",sourceType:"currentTimestamp",value:""},
                messageMapping("SubinventoryCode"),
                messageMapping("serials")
            ],
            subinventoryQuantityTransfer: [
                messageMapping("SourceCode"),
                messageMapping("SourceHeaderId"),
                messageMapping("SourceLineId"),
                messageMapping("TransactionMode"),
                {scmField:"UseCurrentCostFlag",sourceType:"staticBoolean",value:"true"},
                messageMapping("TransactionTypeName"),
                messageMapping("OrganizationId"),
                messageMapping("ItemNumber"),
                messageMapping("TransactionQuantity"),
                messageMapping("TransactionUnitOfMeasure"),
                {scmField:"TransactionDate",sourceType:"currentTimestamp",value:""},
                messageMapping("SubinventoryCode"),
                messageMapping("TransferSubinventory"),
                messageMapping("serials")
            ],
            custom: []
        };

        var endpointMap = {
            createAsset: "installedBaseAssets",
            createMeterReading: "meterReadings",
            subinventoryQuantityTransfer: "inventoryStagedTransactions",
            miscTransaction: "inventoryStagedTransactions"
        };

        // Track whether user has edited mappings for current type
        var _userEditedMappings = false;
        var _lastAutoType = null;

        function updateSections() {
            var type = $("#node-input-transactionType").val();
            var isCustom = (type === "custom");
            $(".custom-section").toggle(isCustom);

            // Update endpoint display
            var serverNodeId = $("#node-input-server").val();
            var serverNode = RED.nodes.node(serverNodeId);
            if (serverNode && !isCustom) {
                var ep = endpointMap[type] || "";
                $("#fusion-url-display").text("https://" + serverNode.hostname + "/fscmRestApi/resources/" + serverNode.version + "/" + ep);
            } else if (isCustom) {
                var customUrl = $("#node-input-customPath").val().trim();
                $("#fusion-url-display").text(customUrl || "Enter Custom URL to preview endpoint");
            } else {
                $("#fusion-url-display").text("Select SCM Server to preview endpoint");
            }

            // Only auto-populate mappings if switching type and user hasn't edited
            if (type !== _lastAutoType && !_userEditedMappings) {
                var template = defaultMappings[type] || [];
                scmMappingEditor.renderAll(template);
                _lastAutoType = type;
            }
        }

        // Initialize mappings editor
        var mappings = [];
        try { mappings = JSON.parse(node.mappings); } catch(e) {}
        if (!Array.isArray(mappings)) mappings = [];

        // If mappings are empty, populate from current transaction type defaults
        if (mappings.length === 0) {
            var initType = node.transactionType || "custom";
            mappings = defaultMappings[initType] || [];
        }

        scmMappingEditor.init({ mappings: JSON.stringify(mappings) });
        _lastAutoType = node.transactionType;

        // Mark user edited on any mapping interaction
        $("#scm-mappings-container").on("change input", ".scm-field,.scm-value,.scm-boolean-value,.scm-source-type", function() {
            _userEditedMappings = true;
        });

        updateSections();
        $("#node-input-transactionType").on("change", function() {
            _userEditedMappings = false;
            updateSections();
        });
        $("#node-input-server").on("change", updateSections);
        $("#node-input-customPath").on("input", updateSections);
        $("#node-input-payloadSource").on("change", syncPayloadSource);
        syncPayloadSource();
    },
    oneditsave: function () {
        var savedMappings = scmMappingEditor.save();
        $("#node-input-mappings").val(savedMappings);
        this.mappings = savedMappings;
    }
});

// =====================================================================
// Shared SCM mapping editor (reused across all SCM transaction nodes)
// Only defined once; safe to include in multiple HTML files.
// =====================================================================
function _syncConventionalPath(row, previousType, nextType, fieldSelector, valueSelector) {
    var field = (row.find(fieldSelector).val() || "").trim();
    var valueInput = row.find(valueSelector);
    var value = (valueInput.val() || "").trim();
    if (!field) return;
    if (previousType === "msg" && nextType === "dequeued" && value === "payload." + field) {
        valueInput.val(field);
    } else if (previousType === "dequeued" && nextType === "msg" && value === field) {
        valueInput.val("payload." + field);
    }
}

if (!window.scmMappingEditor) {
window.scmMappingEditor = (function () {
    var _readOnlyFields = [];
    function _escapeHtml(s) {
        return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    var _valueLabelMap = {
        dequeued: "Dequeued path",
        msg: "Message path",
        static: "Text",
        staticNumber: "Number",
        staticBoolean: "Boolean",
        staticJson: "JSON",
        currentTimestamp: "Timestamp"
    };

    var _valuePlaceholderMap = {
        dequeued: "e.g. AssetNumber",
        msg: "e.g. payload.AssetNumber",
        static: "e.g. STANDARD",
        staticNumber: "e.g. 1",
        staticBoolean: "true or false",
        staticJson: "e.g. [{\"FmSerialNumber\":\"SN001\"}]",
        currentTimestamp: "Generated at runtime"
    };

    function _normalizeBooleanValue(value) {
        var normalized = String(value == null ? "" : value).trim().toLowerCase();
        return normalized === "false" ? "false" : "true";
    }

    var _fieldTypes = {
        OrganizationCode:"text", OperatingOrganizationCode:"text", ItemNumber:"text", AssetNumber:"text",
        Description:"text", CurrentLocationContextCode:"text", MeterCode:"text", MeterUsageCode:"text", Comments:"text",
        WorkOrderNumber:"text", WorkDefinitionCode:"text", WorkOrderStatusCode:"text", WorkOrderTypeCode:"text",
        WorkOrderSubTypeCode:"text", WorkOrderDescription:"text", MntWorkDefinitionCode:"text", SourceCode:"text", TransactionMode:"text",
        TransactionTypeName:"text", TransactionUnitOfMeasure:"text", SubinventoryCode:"text", TransferSubinventory:"text",
        AccountAliasName:"text", ReasonName:"text", CompletionSubinventoryCode:"text", OperationName:"text",
        OperationDescription:"text", WorkCenterCode:"text", UOMCode:"text", SupplySubinventory:"text",
        SupplyLocator:"text", ResourceCode:"text", UsageUOMCode:"text", SerialNumber:"text", WorkOrderProductSerialStatus:"text",
        InventoryItemNumber:"text", TransactionUOMCode:"text", AssemblyAssetNumber:"text", ComplSubinventoryCode:"text",
        Quantity:"number", ReadingValue:"number", SourceHeaderId:"number", SourceLineId:"number", OrganizationId:"number",
        TransactionQuantity:"number", PlannedStartQuantity:"number", WorkOrderPriority:"number",
        OperationSequenceNumber:"number", WoOperationSequenceNumber:"number", RequiredQuantity:"number", RequiredUsage:"number", AssignedUnits:"number",
        MaintainableFlag:"boolean", NewWoAllowedFlag:"boolean", UseCurrentCostFlag:"boolean", ExplosionFlag:"boolean",
        AllowCompletionToInventoryFlag:"boolean", AllowOutOfSequenceOperationCompletionFlag:"boolean",
        CountPointOperationFlag:"boolean", AutoTransactFlag:"boolean", serials:"json", TransactionSerial:"json", OperationTransactionDetail:"json",
        ReadingDate:"date", TransactionDate:"date", PlannedStartDate:"date", PlannedCompletionDate:"date"
    };

    function _rowValue(row, sourceType) {
        if (sourceType === "staticBoolean") return row.find(".scm-boolean-value").val() || "";
        if (sourceType === "staticJson") return row.find(".scm-json-value").val() || "";
        return row.find(".scm-value").val() || "";
    }

    function _syncRowFeedback(row) {
        var sourceType = row.find(".scm-source-type").val();
        var field = row.find(".scm-field").val().trim();
        var value = _rowValue(row, sourceType).trim();
        var preview = "";
        var warning = "";
        if (sourceType === "msg") {
            row.find(".scm-value").attr("placeholder", "e.g. payload." + (field || "FieldName"));
            preview = "Resolves to msg." + (value || "<message path>");
            if (/^msg\./.test(value)) warning = "Enter a path relative to msg (for example, payload." + (field || "FieldName") + ").";
        } else if (sourceType === "dequeued") {
            row.find(".scm-value").attr("placeholder", "e.g. " + (field || "FieldName"));
            preview = "Resolves to msg.dequeued." + (value || "<dequeued path>");
            if (/^(msg\.dequeued\.|dequeued\.)/.test(value)) warning = "Enter a path relative to msg.dequeued (for example, " + (field || "FieldName") + ").";
        }
        var fieldType = _fieldTypes[field];
        if (!warning && _readOnlyFields.indexOf(field) !== -1) {
            warning = field + " is read-only for this operation and must not be sent.";
        }
        if (!warning && fieldType && /^static/.test(sourceType)) {
            var valid = fieldType === "text" ? sourceType === "static" :
                fieldType === "number" ? (sourceType === "staticNumber" || sourceType === "static") :
                fieldType === "boolean" ? sourceType === "staticBoolean" :
                fieldType === "json" ? sourceType === "staticJson" : sourceType === "static";
            if (!valid) warning = field + " expects static " + fieldType + ". Change the source type to avoid changing the Fusion value.";
        }
        if (!warning && fieldType === "date" && sourceType === "static" && value && isNaN(Date.parse(value))) {
            warning = field + " must be an ISO 8601 date-time or use current timestamp.";
        }
        row.find(".scm-resolved-path").text(preview).toggle(!!preview);
        row.find(".scm-mapping-warning").text(warning).toggle(!!warning);
    }

    function _syncValueControl(row, type) {
        var valueInput = row.find(".scm-value");
        var booleanInput = row.find(".scm-boolean-value");
        var jsonInput = row.find(".scm-json-value");
        row.find(".scm-value-label").text(_valueLabelMap[type] || "Value");
        valueInput.attr("placeholder", _valuePlaceholderMap[type] || "");
        _syncRowFeedback(row);

        if (type === "staticBoolean") {
            valueInput.hide().prop("disabled", true);
            jsonInput.hide().prop("disabled", true);
            booleanInput.show().prop("disabled", false);
            if (booleanInput.val() !== "true" && booleanInput.val() !== "false") {
                booleanInput.val("true");
            }
            return;
        }

        if (type === "staticJson") {
            valueInput.hide().prop("disabled", true);
            booleanInput.hide().prop("disabled", true);
            jsonInput.show().prop("disabled", false);
            return;
        }

        booleanInput.hide().prop("disabled", true);
        jsonInput.hide().prop("disabled", true);
        valueInput.show().prop("disabled", type === "currentTimestamp");
        if (type === "currentTimestamp") valueInput.val("");
    }

    function _addRow(m) {
        var srcType = m.sourceType || "static";
        var row = $(
            '<div class="scm-mapping-row" style="border:1px solid #ddd;border-radius:4px;padding:8px;margin-bottom:6px;background:#fafafa;">' +
              '<div style="display:flex;align-items:center;gap:8px;">' +
                '<div class="scm-drag-handle" style="cursor:grab;padding:4px 2px;color:#999;font-size:16px;" title="Drag to reorder">&#9776;</div>' +
                '<div style="flex:1;"><label style="font-size:11px;color:#666;">SCM Field</label>' +
                  '<input type="text" class="scm-field" value="' + _escapeHtml(m.scmField || "") + '" style="width:100%;" /></div>' +
                '<div style="width:140px;"><label style="font-size:11px;color:#666;">Source</label>' +
                  '<select class="scm-source-type" style="width:100%;">' +
                    '<option value="dequeued"' + (srcType === "dequeued" ? ' selected' : '') + '>dequeued data</option>' +
                    '<option value="msg"' + (srcType === "msg" ? ' selected' : '') + '>msg property</option>' +
                    '<option value="static"' + (srcType === "static" ? ' selected' : '') + '>static text</option>' +
                    '<option value="staticNumber"' + (srcType === "staticNumber" ? ' selected' : '') + '>static number</option>' +
                    '<option value="staticBoolean"' + (srcType === "staticBoolean" ? ' selected' : '') + '>static boolean</option>' +
                    '<option value="staticJson"' + (srcType === "staticJson" ? ' selected' : '') + '>static JSON</option>' +
                    '<option value="currentTimestamp"' + (srcType === "currentTimestamp" ? ' selected' : '') + '>current timestamp</option>' +
                  '</select></div>' +
                '<div style="flex:1;"><label style="font-size:11px;color:#666;" class="scm-value-label">' + (_valueLabelMap[srcType] || "Value") + '</label>' +
                  '<input type="text" class="scm-value" value="' + _escapeHtml(m.value || "") + '" placeholder="' + (_valuePlaceholderMap[srcType] || "") + '" style="width:100%;" />' +
                  '<select class="scm-boolean-value" style="width:100%;display:none;">' +
                    '<option value="true">true</option>' +
                    '<option value="false">false</option>' +
                  '</select>' +
                  '<textarea class="scm-json-value" rows="3" style="width:100%;display:none;font-family:monospace;font-size:12px;">' + _escapeHtml(m.value || "") + '</textarea></div>' +
                '<div style="padding-top:14px;">' +
                  '<button type="button" class="red-ui-button red-ui-button-small" onclick="$(this).closest(\'.scm-mapping-row\').remove();">&times;</button></div>' +
              '</div>' +
              '<div class="scm-resolved-path" style="display:none;margin:5px 0 0 28px;font-size:11px;color:#555;"></div>' +
              '<div class="scm-mapping-warning" style="display:none;margin:3px 0 0 28px;font-size:11px;color:#c62828;"></div>' +
            '</div>'
        );
        row.find(".scm-boolean-value").val(_normalizeBooleanValue(m.value));
        row.data("sourceType", srcType);
        row.find(".scm-source-type").on("change", function () {
            var type = $(this).val();
            var previousType = row.data("sourceType");
            _syncConventionalPath(row, previousType, type, ".scm-field", ".scm-value");
            row.data("sourceType", type);
            if (type === "staticBoolean") {
                row.find(".scm-boolean-value").val(_normalizeBooleanValue(row.find(".scm-value").val()));
            }
            if (type === "staticJson" && !row.find(".scm-json-value").val()) {
                row.find(".scm-json-value").val(row.find(".scm-value").val());
            }
            _syncValueControl(row, type);
        });
        row.find(".scm-field,.scm-value,.scm-boolean-value,.scm-json-value").on("input change", function () {
            _syncRowFeedback(row);
        });
        _syncValueControl(row, srcType);
        $("#scm-mappings-container").append(row);
    }

    function renderAll(mappings) {
        $("#scm-mappings-container").empty();
        if (Array.isArray(mappings)) {
            mappings.forEach(function (m) { _addRow(m); });
        }
    }

    function init(node) {
        _readOnlyFields = Array.isArray(node.readOnlyFields) ? node.readOnlyFields : [];
        var mappings = [];
        try { mappings = JSON.parse(node.mappings); } catch(e) { mappings = []; }
        if (!Array.isArray(mappings)) mappings = [];
        renderAll(mappings);

        $("#btn-add-scm-mapping").off("click").on("click", function () {
            _addRow({ scmField: "", sourceType: "static", value: "" });
        });

        $("#scm-mappings-container").sortable({
            handle: ".scm-drag-handle", axis: "y", cursor: "grabbing",
            opacity: 0.7, placeholder: "scm-sortable-placeholder", tolerance: "pointer"
        });
    }

    function setReadOnlyFields(fields) {
        _readOnlyFields = Array.isArray(fields) ? fields : [];
        $("#scm-mappings-container .scm-mapping-row").each(function () {
            _syncRowFeedback($(this));
        });
    }

    function save() {
        var mappings = [];
        $("#scm-mappings-container .scm-mapping-row").each(function () {
            var row = $(this);
            var sourceType = row.find(".scm-source-type").val();
            var m = {
                scmField: row.find(".scm-field").val().trim(),
                sourceType: sourceType,
                value: sourceType === "staticJson" ? row.find(".scm-json-value").val().trim() : sourceType === "staticBoolean" ? row.find(".scm-boolean-value").val() : row.find(".scm-value").val().trim()
            };
            if (m.scmField) mappings.push(m);
        });
        return JSON.stringify(mappings);
    }

    return { init: init, save: save, renderAll: renderAll, setReadOnlyFields: setReadOnlyFields };
})();
var scmMappingEditor = window.scmMappingEditor;
}

</script>
<style>    .scm-sortable-placeholder { border:2px dashed #4F7D7B; border-radius:4px; background:#eef5f4; height:50px; margin-bottom:6px; }
    .scm-drag-handle:hover { color:#555 !important; }
</style>

<script type="text/x-red" data-template-name="fusion-request">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-server"><i class="fa fa-globe"></i> SCM Server</label>
        <input type="text" id="node-input-server" />
    </div>
    <hr/>
    <div class="form-row">
        <label for="node-input-transactionType"><i class="fa fa-list"></i> Transaction Type</label>
        <select id="node-input-transactionType" style="width:200px;">
            <option value="custom">Custom</option>
            <option value="createAsset">Create Asset</option>
            <option value="createMeterReading">Create Meter Reading</option>
            <option value="miscTransaction">Miscellaneous Transaction</option>
            <option value="subinventoryQuantityTransfer">Subinventory Quantity Transfer</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-method"><i class="fa fa-arrow-right"></i> Method</label>
        <select id="node-input-method" style="width:120px;">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="PATCH">PATCH</option>
            <option value="DELETE">DELETE</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-requestMediaType"><i class="fa fa-file-code-o"></i> Media Type</label>
        <select id="node-input-requestMediaType" style="width:200px;">
            <option value="resourceItem">ADF Resource Item</option>
            <option value="adfAction">ADF Action</option>
            <option value="json">JSON</option>
            <option value="adfBatch">ADF Batch</option>
        </select>
        <div style="margin-left:105px;font-size:11px;color:#888;margin-top:2px;">
            ADF Action and ADF Batch require <code>POST</code>. Batch also requires the exact API-version root and a <code>parts</code> array from the selected payload source.
        </div>
    </div>
    <hr/>
    <div class="custom-section scm-custom-endpoint-section" style="display:none;">
        <div class="form-row" id="custom-path-row">
            <label for="node-input-customPath" style="vertical-align:top;margin-top:2px;"><i class="fa fa-pencil"></i> Custom Endpoint</label>
            <textarea id="node-input-customPath" rows="3" style="width:calc(100% - 107px);font-family:monospace;font-size:12px;" placeholder="https://hostname/fscmRestApi/resources/version/endpoint"></textarea>
            <div style="margin-left:105px;font-size:11px;color:#888;margin-top:2px;">
                Used only when Transaction Type is <code>Custom</code>. Enter an HTTPS URL at or below the configured SCM API-version root, without credentials or a fragment.
            </div>
        </div>
    </div>
    <div class="form-row">
        <label><i class="fa fa-link"></i> Endpoint</label>
        <span id="fusion-url-display" class="scm-endpoint-preview" style="font-size:12px;color:#555;word-break:break-all;">Select SCM Server to preview endpoint</span>
    </div>
    <hr/>
    <div class="form-row">
        <label for="node-input-payloadSource"><i class="fa fa-sign-in"></i> Payload Source</label>
        <select id="node-input-payloadSource" style="width:200px;">
            <option value="mappings">Mapped fields</option>
            <option value="msgPayload">Entire msg.payload</option>
        </select>
    </div>
    <div class="form-row scm-direct-payload-hint" style="display:none;">
        <div style="margin-left:105px;font-size:11px;color:#888;">
            Uses the complete <code>msg.payload</code> object as query parameters for <code>GET</code> or as the request body for write methods. Saved mappings are retained but ignored.
        </div>
    </div>
    <div class="scm-payload-mappings">
        <div class="form-row">
            <label><i class="fa fa-list-ul"></i> Payload Mappings</label>
            <div style="margin-left:105px;font-size:11px;color:#888;margin-bottom:4px;">
                Map SCM API fields to dequeued data, message properties, typed static values including static JSON, or the current timestamp. Drag &#9776; to reorder.
                Selecting a new transaction type will populate default fields.
                For <code>GET</code>, mappings become query parameters; for <code>POST</code>/<code>PUT</code>/<code>PATCH</code>, mappings become the JSON body; for <code>DELETE</code>, mappings are not sent.
            </div>
        </div>
        <div class="form-row">
            <div id="scm-mappings-container" style="margin-left:20px;margin-right:20px;"></div>
            <div style="margin-left:20px;margin-top:4px;">
                <button type="button" class="red-ui-button red-ui-button-small" id="btn-add-scm-mapping">+ Add Mapping</button>
            </div>
        </div>
        <input type="hidden" id="node-input-mappings">
    </div>
</script>

<script type="text/x-red" data-help-name="fusion-request">
<p>A unified Oracle Fusion SCM request node that supports all common transaction types
and custom endpoints in a single configurable interface.</p>
<h3>Configuration</h3>
<dl class="message-properties">
    <dt>SCM Server</dt><dd>Server configuration for authentication and connection.</dd>
    <dt>Transaction Type</dt>
    <dd>Selects the REST endpoint and pre-populates default field mappings:
        <ul>
            <li><b>Create Asset</b> &mdash; Installed Base Assets endpoint</li>
            <li><b>Create Meter Reading</b> &mdash; Meter Readings endpoint</li>
            <li><b>Miscellaneous Transaction</b> &mdash; Inventory Staged Transactions endpoint</li>
            <li><b>Subinventory Quantity Transfer</b> &mdash; Inventory Staged Transactions endpoint</li>
            <li><b>Custom</b> &mdash; provide your own endpoint URL</li>
        </ul>
    </dd>
    <dt>Method</dt><dd>HTTP method (GET, POST, PUT, PATCH, DELETE).</dd>
    <dt>Media Type</dt>
    <dd>
        <ul>
            <li><b>ADF Resource Item</b> &mdash; resource collection and item requests.</li>
            <li><b>ADF Action</b> &mdash; action requests. Requires <code>POST</code>; supports both <code>/action/name</code> URLs and Oracle's action-in-payload form on a resource URL.</li>
            <li><b>JSON</b> &mdash; SCM endpoints that document <code>application/json</code>.</li>
            <li><b>ADF Batch</b> &mdash; multi-part requests. Requires <code>POST</code> to the exact configured API-version root and a mapped <code>parts</code> array.</li>
        </ul>
    </dd>
    <dt>Endpoint</dt><dd>Read-only preview of the endpoint base URL for the selected Transaction Type and SCM Server.</dd>
    <dt>Custom URL</dt><dd>Custom endpoint used only when Transaction Type is <code>Custom</code>. It must use HTTPS, cannot contain credentials or a fragment, and must remain at or below the configured SCM Server's exact <code>/fscmRestApi/resources/{api-version}</code> root. Custom requests do not follow redirects.</dd>
    <dt>Payload Source</dt><dd><code>Mapped fields</code> builds request data only from the mapping table and requires at least one mapping for <code>POST</code>, <code>PUT</code>, and <code>PATCH</code>. Parameterless <code>GET</code> and <code>DELETE</code> requests may omit mappings. Mapped fields never falls back to <code>msg.payload</code>. <code>Entire msg.payload</code> uses a validated copy of the complete input object and ignores, but retains, saved mappings. For <code>GET</code> it becomes query parameters; for write methods it becomes the JSON body.</dd>
    <dt>Payload Mappings</dt>
    <dd>Map SCM API fields to values. Each row specifies:
        <ul>
            <li><b>SCM Field</b> &mdash; the API field name</li>
            <li><b>Source</b> &mdash; <code>dequeued data</code> (reads from msg.dequeued), <code>msg property</code> (any msg path), <code>static text</code>, <code>static number</code>, <code>static boolean</code>, <code>static JSON</code>, or <code>current timestamp</code></li>
            <li><b>Value</b> &mdash; the field name, property path, or literal value</li>
        </ul>
        For <code>GET</code>, mapped fields are sent as query parameters. For <code>POST</code>/<code>PUT</code>/<code>PATCH</code>, mapped fields are sent as the JSON request body. For <code>DELETE</code>, mapped fields are not sent.
    </dd>
</dl>
<h3>Outputs</h3>
<dl class="message-properties">
    <dt>payload <span class="property-type">object|string</span></dt><dd>Raw API response body on success, error details on failure.</dd>
    <dt>statusCode <span class="property-type">number</span></dt><dd>HTTP status code.</dd>
    <dt>error <span class="property-type">object</span></dt><dd>Error details on failure: <code>{ message, code }</code>.</dd>
</dl>
<h3>Runtime overrides</h3>
<dl class="message-properties">
    <dt>msg.method <span class="property-type">string</span></dt><dd>Overrides the configured HTTP method for this message (e.g. <code>GET</code>, <code>POST</code>, <code>PATCH</code>). Case-insensitive.</dd>
</dl>

<h3>Details</h3>
<p>This is the primary SCM transaction node. Select a transaction type to auto-populate the endpoint
and default field mappings, or choose <b>Custom</b> to target any Fusion SCM REST endpoint.</p>
<p>The node validates Custom URLs, methods, media types, and ADF Batch parts before acquiring an OAuth
token. Batch part IDs must be unique; paths must be relative SCM resource paths, with or without a
leading slash, and must not contain traversal. Slashless <code>get</code>, <code>create</code>,
<code>update</code>, <code>replace</code>, and <code>delete</code> paths receive a leading slash in
the outbound request without changing the incoming message; <code>invoke</code> paths are preserved;
operations must be <code>get</code>, <code>create</code>, <code>update</code>, <code>replace</code>,
<code>delete</code>, or <code>invoke</code>. Create, update, and replace operations require an object
payload. Invoke operations may omit the payload for parameterless actions, but any supplied payload
must be an object.</p>
<p>Use the dedicated <b>smart operations event</b> node for
<code>/api/scm-core/operational-data/v1/events</code>. The generic Custom mode is limited to the
configured Fusion SCM resource hierarchy.</p>
<p>Payload usage depends on the effective HTTP method: <code>GET</code> sends the selected payload
source as query parameters, <code>POST</code>/<code>PUT</code>/<code>PATCH</code> sends it as the JSON
request body, and <code>DELETE</code> does not send request data.</p>
<p>On success, the node status is <code>read</code> for <code>GET</code>, <code>submitted</code> for
<code>POST</code>, <code>updated</code> for <code>PUT</code>/<code>PATCH</code>, or <code>deleted</code>
for <code>DELETE</code>. The output payload remains the raw Fusion response body.</p>
